<body><main class="page">
<nav class="nav"><a class="brand" href="">VHMART</a><a href="marketplace">Marketplace</a><button id="logout" type="button">Sign out</button></nav>
<h1>My account</h1>
<section class="form-panel" id="details"><p class="empty">Loading your account...</p></section>
<section class="form-panel">
  <h2>Delete this account</h2>
  <p>Deleting your account signs you out and hides your profile and saved products. The record is kept so VHMART can meet legal and record-keeping duties, and an admin can restore it later.</p>
  <button id="deleteAccount" class="button button--danger" type="button">Delete my account</button>
  <p id="deleteMessage" role="status"></p>
</section>
</main>
<script type="module">
import { requireUser, logout } from './js/auth.js';
import { auth, database } from './js/firebase.js';
import { push, get, ref, set, update, serverTimestamp, query, orderByChild, equalTo } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';

logout(document.querySelector('#logout'));
const details = document.querySelector('#details');
const deleteMessage = document.querySelector('#deleteMessage');

requireUser(async (user, profile) => {
  if (profile.deletedAt || profile.active === false) { location.href = 'account-deleted'; return; }
  details.replaceChildren();
  const heading = document.createElement('h2');
  heading.textContent = profile.name || profile.email || 'Your account';
  const email = document.createElement('p');
  email.textContent = 'Email: ' + (profile.email || user.email || '');
  const role = document.createElement('p');
  // An admin has no `role` in their own profile row, because admin access lives
  // in the admins node or a custom claim. requireUser() resolves it to 'admin',
  // so a two-way check here used to label every administrator as a Customer.
  const roleLabel = { admin: 'Administrator', vendor: 'Vendor', customer: 'Customer' }[profile.role] || 'Customer';
  role.textContent = 'Account type: ' + roleLabel;
  if (profile.role === 'admin') {
    role.textContent += ' (full access to every account on the site)';
  }
  const joined = document.createElement('p');
  joined.textContent = 'Joined: ' + (profile.createdAt ? new Date(profile.createdAt).toLocaleDateString() : 'recently');
  details.append(heading, email, role, joined);

  document.querySelector('#deleteAccount').addEventListener('click', async (event) => {
    const ok = window.confirm('Delete your VHMART account? You will be signed out and your profile will no longer appear on the site.');
    if (!ok) return;
    event.target.disabled = true;
    deleteMessage.textContent = 'Deleting your account...';
    try {
const updates = [];
      updates.push([`users/${user.uid}`, { active: false, deletedAt: serverTimestamp(), deletedBy: user.uid, updatedAt: serverTimestamp() }]);
      const vendorSnapshot = await get(ref(database, `vendors/${user.uid}`));
      if (vendorSnapshot.exists()) {
        updates.push([`vendors/${user.uid}`, { status: 'SUSPENDED', deletedAt: serverTimestamp(), deletedBy: user.uid, updatedAt: serverTimestamp() }]);
      }
      const productSnapshot = await get(query(ref(database, 'products'), orderByChild('ownerUid'), equalTo(user.uid)));
      if (productSnapshot.exists()) {
        Object.entries(productSnapshot.val()).forEach(([productId, product]) => {
          if (!product.deletedAt) updates.push([`products/${productId}`, { status: 'SUSPENDED', deletedAt: serverTimestamp(), deletedBy: user.uid, updatedAt: serverTimestamp() }]);
        });
      }
      // Realtime Database rules only cascade downwards, so a multi-path update
      // scoped at the root is denied even when each child path is writable.
      // Each path is written separately, and the account itself goes first so a
      // partial failure always leaves the account with less access.
      for (const [path, value] of updates) {
        await update(ref(database, path), value);
      }
      try {
        await update(push(ref(database, 'audit_logs')), { actor: user.uid, action: 'self_delete_user', target: user.uid, detail: 'Deleted by the account holder', timestamp: serverTimestamp() });
      } catch (auditError) {
        // The deletion has already taken effect; a missing audit entry must not
        // be reported as a failed deletion.
        console.warn('Self-delete audit entry not written:', auditError && auditError.message);
      }
      location.href = 'account-deleted';
    } catch (error) {
      console.error(error);
      deleteMessage.textContent = 'We could not delete your account. Please try again.';
      event.target.disabled = false;
    }
  });
}, 'login.html', () => { details.textContent = 'We could not load your account. Please refresh and try again.'; });
</script><script src="js/brand-avatar.js"></script><script src="js/theme.js"></script><script src="js/track.js"></script></body></html>
