<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="css/main.css"><title>Profile | VHMART</title></head>
<body><header class="site-header"><nav class="nav" aria-label="Main navigation"><a class="brand" href="">VHMART</a><div class="nav-links"><a href="marketplace">Marketplace</a><button id="logout" type="button">Sign out</button></div></nav></header><main class="page"><h1>Your profile</h1><section class="form-panel"><p>Customers can edit their contact details and password here. Email cannot be changed.</p><form id="profileForm"><label for="name">Full name<input id="name" required></label><label for="countryCode">Country code<select id="countryCode" aria-label="Country dialling code"><option value="+234" selected>Nigeria +234</option><option value="+1">US & Canada +1</option><option value="+44">United Kingdom +44</option><option value="+233">Ghana +233</option><option value="+254">Kenya +254</option><option value="+27">South Africa +27</option><option value="+30">Greece +30</option><option value="+353">Ireland +353</option><option value="+91">India +91</option><option value="+55">Brazil +55</option><option value="+7">Russia +7</option></select></label><label for="phone">Phone<input id="phone" type="tel"></label><label for="waCountryCode">WhatsApp country code<select id="waCountryCode" aria-label="WhatsApp dialling code"><option value="+234" selected>Nigeria +234</option><option value="+1">US & Canada +1</option><option value="+44">United Kingdom +44</option><option value="+233">Ghana +233</option><option value="+254">Kenya +254</option><option value="+27">South Africa +27</option><option value="+30">Greece +30</option><option value="+353">Ireland +353</option><option value="+91">India +91</option><option value="+55">Brazil +55</option><option value="+7">Russia +7</option></select></label><label for="whatsapp">WhatsApp<input id="whatsapp" type="tel"></label><label for="email">Email<input id="email" type="email" readonly></label><label for="facebook">Facebook<input id="facebook" type="url"></label><label for="instagram">Instagram<input id="instagram" type="url"></label><label for="twitter">X (Twitter)<input id="twitter" type="url"></label><label for="tiktok">TikTok<input id="tiktok" type="url"></label><label for="youtube">YouTube<input id="youtube" type="url"></label><label for="linkedin">LinkedIn<input id="linkedin" type="url"></label><label for="website">Website<input id="website" type="url"></label><button class="button button--primary">Save profile</button><p id="msg" role="status"></p></form></section><div id="security"></div></main>
<script type="module">
import { requireUser, logout } from './js/auth.js'; import { database } from './js/firebase.js'; import { ref, update, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js'; import { joinPhone, selectCountryFor } from './js/contact-links.js';
const f=document.querySelector('#profileForm'),m=document.querySelector('#msg');document.querySelector('#logout').addEventListener('click',logout);
requireUser(async(user,p)=>{
  const { renderPasswordForm, renderEmailForm } = await import('./js/profile-edit.js');
  const s=document.querySelector('#security'); renderEmailForm(s); renderPasswordForm(s);
  f.email.value=user.email||p.email||''; for(const k of ['name','phone','whatsapp','facebook','instagram','twitter','tiktok','youtube','linkedin','website']) if(f[k]) f[k].value=p[k]||'';
  selectCountryFor(f.countryCode,p.phone); selectCountryFor(f.waCountryCode,p.whatsapp); if(p.phone) f.phone.value=p.phone.replace(/^\+/,''); if(p.whatsapp) f.whatsapp.value=p.whatsapp.replace(/^\+/,'');
  f.addEventListener('submit',async e=>{e.preventDefault(); const b=f.querySelector('button'); b.disabled=true; try{await update(ref(database,`users/${user.uid}`),{name:f.name.value.trim(),phone:joinPhone(f.countryCode,f.phone.value),whatsapp:joinPhone(f.waCountryCode,f.whatsapp.value),facebook:f.facebook.value.trim(),instagram:f.instagram.value.trim(),twitter:f.twitter.value.trim(),tiktok:f.tiktok.value.trim(),youtube:f.youtube.value.trim(),linkedin:f.linkedin.value.trim(),website:f.website.value.trim(),updatedAt:serverTimestamp()}); m.textContent='Profile saved.';}catch(err){m.textContent='Could not save.';}finally{b.disabled=false;}});
},{loginPath:'login'});
</script></body></html>
