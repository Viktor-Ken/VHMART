</head><body><main class="page"><a href="index.html">Back to VHMART</a><section class="form-panel"><h1>Create account</h1><p>Browse freely. An account is required to send enquiries.</p><form id="registerForm"><label for="name">Full name<input id="name" autocomplete="name" required></label><label for="email">Email<input id="email" type="email" autocomplete="email" required></label><label for="password">Password<span class="password-field"><input id="password" type="password" autocomplete="new-password" minlength="8" required><button class="password-toggle" type="button" data-password-toggle="password" data-password-label-hidden="Hide password" aria-label="Show password" aria-pressed="false"></button></span></label><button class="button button--primary" type="submit">Create account</button><p id="message" role="status"></p></form><p>Already registered? <a href="login.html">Sign in</a> · <a href="vendor/register.html">Register as a vendor</a></p></section></main><script type="module">import { auth, database } from './js/firebase.js'; import { createUserWithEmailAndPassword, updateProfile } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js'; import { ref, set, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js'; const safeNext=()=>{try{const raw=new URLSearchParams(location.search).get('next')||'';if(!raw||raw.startsWith('//')||raw.includes('\\'))return 'index.html';const u=new URL(raw,location.origin+'/');if(u.origin!==location.origin)return 'index.html';return (u.pathname.replace(/^\//,'')||'index.html')+u.search;}catch(e){return 'index.html';}}; const nextParam=new URLSearchParams(location.search).get('next');if(nextParam){const signIn=document.querySelector('a[href="login.html"]');if(signIn)signIn.href='login.html?next='+encodeURIComponent(nextParam);} const form=document.querySelector('#registerForm'),message=document.querySelector('#message'); form.addEventListener('submit',async(event)=>{event.preventDefault();const button=form.querySelector('button[type="submit"]');button.disabled=true;message.textContent='Creating account...';try{const credential=await createUserWithEmailAndPassword(auth,form.email.value.trim(),form.password.value);await updateProfile(credential.user,{displayName:form.name.value.trim()});await set(ref(database,`users/${credential.user.uid}`),{name:form.name.value.trim(),email:credential.user.email,role:'customer',active:true,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});location.href=safeNext();}catch(error){message.textContent=error.code==='auth/email-already-in-use'?'That email is already registered.':'We could not create your account.';console.error(error);button.disabled=false;}});</script><script src="js/password-toggle.js"></script><script src="js/session.js"></script><script src="js/brand-avatar.js"></script><script src="js/theme.js"></script><script src="js/track.js"></script></body></html>
