<body><main class="page">
<nav class="nav"><a class="brand" href="../index.html">VHMART</a><button id="logout" type="button">Sign out</button></nav>
<section class="form-panel" id="statusPanel"><h1>Vendor application</h1><p class="empty">Loading your application status...</p></section>
</main>
<script type="module">
import { requireUser, logout } from '../js/auth.js';
logout(document.querySelector('#logout'));
const panel = document.querySelector('#statusPanel');

function render(title, body, tone) {
  panel.replaceChildren();
  const heading = document.createElement('h1');
  heading.textContent = title;
  const copy = document.createElement('p');
  copy.textContent = body;
  panel.append(heading, copy);
  if (tone) copy.style.color = tone;
}

requireUser(async (user, profile) => {
  if (profile.role !== 'vendor') { location.href = '../index.html'; return; }
  if (profile.deletedAt) { location.href = 'deleted.html'; return; }
  if (profile.status === 'ACTIVE') { location.href = 'dashboard.html'; return; }
  if (profile.status === 'PENDING') {
    render('Application received', 'Your vendor application is with a VHMART admin for review. Every new vendor is approved before the storefront and dashboard open up. This usually takes a day.', '#176b55');
  } else if (profile.status === 'DECLINED') {
    const reason = profile.declinedReason ? ' Reason given: ' + profile.declinedReason + '.' : '';
    render('Application not approved', 'We could not approve this vendor account right now.' + reason + ' You are welcome to apply again after updating your details.', '#e76f51');
  } else {
    render('Account suspended', 'This vendor account is currently suspended. Contact VHMART support if you believe this is a mistake.', '#e76f51');
  }
  const back = document.createElement('p');
  const link = document.createElement('a');
  link.href = '../index.html';
  link.textContent = 'Back to VHMART';
  back.append(link);
  panel.append(back);
}, '../login.html', () => render('Could not load your application', 'Please refresh and try again.', '#e76f51'));
</script><script src="../js/brand-avatar.js"></script><script src="../js/theme.js"></script><script src="../js/track.js"></script></body></html>
