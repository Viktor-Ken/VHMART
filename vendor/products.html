<body><main class="page"><nav class="nav"><a class="brand" href="dashboard.html">VHMART</a><a href="add-product.html" class="button button--primary">Add product</a><a href="enquiries.html">Enquiries</a><button id="logout" type="button">Sign out</button></nav>
<h1>My products</h1><div id="products" class="product-grid"><p class="empty">Loading products...</p></div>
</main>
<script type="module">
import { requireUser, logout } from '../js/auth.js';
import { ownedProducts, deleteProduct, formatPrice } from '../js/products.js';
logout(document.querySelector('#logout'));
const root = document.querySelector('#products');
function showMessage(text, className = 'empty') { root.replaceChildren(); const el = document.createElement('p'); el.className = className; el.textContent = text; root.append(el); }
requireUser(async (user, profile) => {
  if (profile.role !== 'vendor') { location.href = '../index.html'; return; }
  try {
    const products = await ownedProducts(user.uid);
    root.replaceChildren();
    if (!products.length) { showMessage('No products yet. Add your first product to get started.'); return; }
    products.forEach((product) => {
      const card = document.createElement('article'); card.className = 'product-card';
      if (product.image) { const image = document.createElement('img'); image.src = product.image; image.alt = product.name || 'Product image'; image.loading = 'lazy'; card.append(image); }
      const body = document.createElement('div'); body.className = 'product-card__body';
      const title = document.createElement('h2'); title.textContent = product.name || 'Unnamed product';
      const price = document.createElement('p'); price.className = 'product-price'; price.textContent = formatPrice(product.price) || 'No price set';
      const description = document.createElement('p'); description.textContent = product.description || 'No description provided.';
      const status = document.createElement('p'); status.textContent = `Status: ${product.status === 'PUBLISHED' ? 'LIVE' : (product.status || 'UNKNOWN')}`;
      const category = document.createElement('p'); category.textContent = `Category: ${(product.categoryId || 'general').replaceAll('-', ' ')}`;
      const actions = document.createElement('div'); actions.className = 'button-row';
      const edit = document.createElement('a'); edit.className = 'button button--quiet'; edit.href = `edit-product.html?id=${encodeURIComponent(product.id)}`; edit.textContent = 'Edit product';
      const del = document.createElement('button'); del.type = 'button'; del.className = 'button button--danger'; del.textContent = 'Delete';
      del.addEventListener('click', async () => {
        if (!confirm(`Delete "${product.name || 'this product'}"? This cannot be undone.`)) return;
        try { await deleteProduct(product.id); card.remove(); if (!root.children.length) showMessage('All products deleted. Add your first product to get started.'); } catch (error) { console.error('Delete failed:', error); alert('Could not delete the product. Please try again.'); }
      });
      actions.append(edit, del); body.append(title, price, description, category, status, actions); card.append(body); root.append(card);
    });
  } catch (error) { console.error('Products load failed:', error); showMessage('We could not load your products right now. Please refresh and try again.', 'error'); }
}, '../login.html', (error) => { console.error('Vendor authentication failed:', error); showMessage('We could not load your account. Please refresh and try again.', 'error'); });
</script><script src="../js/brand-avatar.js"></script><script src="../js/theme.js"></script><script src="../js/track.js"></script></body></html>
