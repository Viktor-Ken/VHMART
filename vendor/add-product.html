<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../css/main.css"><title>Add product | VHMART</title></head>
<body><main class="page"><a href="dashboard">Back to dashboard</a><h1>Add product</h1><section class="form-panel"><form id="form"><label for="name">Product name<input id="name" required maxlength="120"></label><label for="price">Price (NGN)<input id="price" type="number" min="0" step="0.01"></label><label for="image">Image URL<input id="image" type="url" placeholder="https://..."></label><label for="categoryId">Category<select id="categoryId"><option value="hospital-lab-equipment">Hospital & lab equipment</option><option value="wellness">Wellness</option><option value="fitness">Fitness</option><option value="men-shoes">Men shoes</option><option value="women-shoes">Women shoes</option></select></label><label for="availability">Availability<select id="availability"><option value="In stock">In stock</option><option value="Out of stock">Out of stock</option><option value="Contact vendor">Contact vendor</option></select></label><label for="description">Description<textarea id="description" required maxlength="3000"></textarea></label><button class="button button--primary">Publish product</button><p id="msg" role="status"></p></form></section></main>
<script type="module">
import { requireUser } from '../js/auth.js'; import { database, auth } from '../js/firebase.js'; import { push, ref, serverTimestamp, update } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';
const f=document.querySelector('#form'),m=document.querySelector('#msg');
requireUser(async(user,p)=>{
  if(p.role!=='vendor'||p.deletedAt||p.status!=='ACTIVE'){location.href='../login';return;}
  const vid=p.vendorId||user.uid; f.addEventListener('submit',async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;try{const pr=push(ref(database,'products'));const now=serverTimestamp();const priceVal=f.price.value.trim()===''?null:Number(f.price.value);await update(pr,{id:pr.key,vendorId:vid,name:f.name.value.trim(),price:priceVal,image:f.image.value.trim(),categoryId:f.categoryId.value,availability:f.availability.value,description:f.description.value.trim(),status:'PUBLISHED',createdAt:now,updatedAt:now,createdBy:user.uid});m.textContent='Product published.';f.reset();}catch(err){m.textContent='Failed to publish.';}finally{b.disabled=false;}});
},{loginPath:'../login'});
</script></body></html>
