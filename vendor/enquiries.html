<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../css/main.css"><title>Enquiries | VHMART</title></head>
<body><main class="page"><a href="dashboard">Back</a><h1>Enquiries</h1><div id="list" class="product-grid"><p class="empty">Loading...</p></div></main>
<script type="module">
import { requireUser } from '../js/auth.js'; import { database } from '../js/firebase.js'; import { get, ref, query, orderByChild, equalTo } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';
const l=document.querySelector('#list');
requireUser(async(user,p)=>{
  if(p.role!=='vendor'||p.status!=='ACTIVE'){location.href='../login';return;}
  const vid=p.vendorId||user.uid; const s=await get(query(ref(database,'enquiries'),orderByChild('vendorId'),equalTo(vid))); l.replaceChildren(); if(!s.exists()){const e=document.createElement('p');e.className='empty';e.textContent='No enquiries.';l.append(e);return;} Object.entries(s.val()).map(([id,x])=>({id,...x})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(en=>{const art=document.createElement('article');art.className='form-panel';const h=document.createElement('h3');h.textContent=en.customerName||'Customer';const m=document.createElement('p');m.textContent=en.message||'';const r=document.createElement('p');r.textContent='Reply via: '+en.replyType+' - '+(en.replyValue||'');const st=document.createElement('p');st.textContent='Status: '+en.status;art.append(h,m,r,st);l.append(art);});
},{loginPath:'../login'});
</script></body></html>
