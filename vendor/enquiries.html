<body><main class="page"><nav class="nav"><a class="brand" href="dashboard.html">VHMART</a><a href="products.html">Products</a><a href="profile.html">Profile</a><button id="logout" type="button">Sign out</button></nav>
<h1>Enquiries</h1><div id="list"><p class="empty">Loading enquiries...</p></div>
</main>
<script type="module">
import { requireUser, logout } from '../js/auth.js';
import { database } from '../js/firebase.js';
import { loadVendorEnquiries, formatEnquiryDate } from '../js/enquiries.js';
import { ref, update } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';
logout(document.querySelector('#logout'));
const root = document.querySelector('#list');
function showMessage(text, className = 'empty') { root.replaceChildren(); const el = document.createElement('p'); el.className = className; el.textContent = text; root.append(el); }
function line(label, value) { const p = document.createElement('p'); p.textContent = `${label}: ${value}`; return p; }
requireUser(async (user, profile) => {
  if (profile.role !== 'vendor') { location.href = '../index.html'; return; }
  try {
    const entries = await loadVendorEnquiries(user.uid);
    root.replaceChildren();
    if (!entries.length) { showMessage('No enquiries yet. Customer enquiries will appear here.'); return; }
    entries.forEach((item) => {
      const card = document.createElement('article'); card.className = 'form-panel';
      const title = document.createElement('h2'); title.textContent = item.customerName || 'Customer enquiry';
      card.append(title, line('Product', item.productName || item.productId || 'Not specified'));
      if (item.createdAt) card.append(line('Received', formatEnquiryDate(item.createdAt)));
      if (item.customerEmail) card.append(line('Email', item.customerEmail));
      if (item.customerPhone) card.append(line('Phone', item.customerPhone));
      if (item.replyValue) card.append(line(`Reply by ${item.replyMethod || 'contact'}`, item.replyValue));
      const message = document.createElement('p'); message.textContent = item.message || 'No message supplied.';
      const status = document.createElement('p'); status.textContent = `Status: ${item.status || 'NEW'}`;
      const button = document.createElement('button'); button.className = 'button button--quiet'; button.type = 'button'; button.textContent = item.status === 'RESPONDED' ? 'Responded' : 'Mark responded'; button.disabled = item.status === 'RESPONDED';
      button.addEventListener('click', async () => {
        button.disabled = true;
        try {
          const response = { status: 'RESPONDED', updatedAt: Date.now() };
          await update(ref(database, `enquiries/${item.id}`), response);
          // The vendor-inbox copy is best-effort; the enquiry itself is already updated.
          try { await update(ref(database, `vendor_enquiries/${user.uid}/${item.id}`), response); } catch (mirrorError) { console.warn('Inbox copy not updated:', mirrorError); }
          status.textContent = 'Status: RESPONDED'; button.textContent = 'Responded';
        } catch (error) { console.error('Enquiry update failed:', error); button.disabled = false; }
      });
      card.append(message, status, button); root.append(card);
    });
  } catch (error) { console.error('Enquiries load failed:', error); showMessage('We could not load your enquiries right now. Please refresh and try again.', 'error'); }
}, '../login.html', (error) => { console.error('Vendor authentication failed:', error); showMessage('We could not load your account. Please refresh and try again.', 'error'); });
</script><script src="../js/brand-avatar.js"></script><script src="../js/theme.js"></script><script src="../js/track.js"></script></body></html>
