<body><main class="page">
<nav class="nav"><a class="brand" href="../index.html">VHMART</a><a href="products.html">Products</a><a href="enquiries.html">Enquiries</a><a href="profile.html">Profile</a><button id="logout" type="button">Sign out</button></nav>
<h1>Vendor dashboard</h1>
<div id="stats" class="category-grid"><p class="empty">Loading dashboard...</p></div>
<section class="form-panel" aria-labelledby="dashboard-products-title"><h2 id="dashboard-products-title">My products</h2><div id="dashboardProducts"><p class="empty">Loading products...</p></div><p><a href="products.html">View all products</a></p></section>
<section class="form-panel" aria-labelledby="dashboard-enquiries-title"><h2 id="dashboard-enquiries-title">Recent enquiries</h2><div id="dashboardEnquiries"><p class="empty">Loading enquiries...</p></div><p><a href="enquiries.html">View all enquiries</a></p></section>
<p id="message" role="status"></p>
</main>
<script type="module">
import { requireUser, logout } from '../js/auth.js';
import { ownedProducts, formatPrice } from '../js/products.js';
import { database } from '../js/firebase.js';
import { get, ref, query, orderByChild, equalTo } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';

logout(document.querySelector('#logout'));

const statsRoot = document.querySelector('#stats');
const productsRoot = document.querySelector('#dashboardProducts');
const enquiriesRoot = document.querySelector('#dashboardEnquiries');
const message = document.querySelector('#message');

function showEmpty(root, text) {
  root.replaceChildren();
  const empty = document.createElement('p');
  empty.className = 'empty';
  empty.textContent = text;
  root.append(empty);
}

function showError(root, text) {
  root.replaceChildren();
  const error = document.createElement('p');
  error.className = 'error';
  error.textContent = text;
  root.append(error);
}

function renderStats(products, enquiries) {
  const values = [
    ['Total products', products.length],
    ['Live products', products.filter((p) => p.status === 'PUBLISHED').length],
    ['Archived products', products.filter((p) => p.status === 'ARCHIVED').length],
    ['New enquiries', enquiries.filter((e) => e.status === 'NEW').length]
  ];
  statsRoot.replaceChildren();
  values.forEach(([label, value]) => {
    const card = document.createElement('article');
    card.className = 'category-card';
    card.style.backgroundImage = 'linear-gradient(135deg,#176b55,#e76f51)';
    const title = document.createElement('h3');
    title.textContent = `${label}: ${value}`;
    card.append(title);
    statsRoot.append(card);
  });
}

function renderProducts(products) {
  if (!products.length) { showEmpty(productsRoot, 'No products yet. Add your first product to get started.'); return; }
  productsRoot.replaceChildren();
  products.slice(0, 5).forEach((product) => {
    const item = document.createElement('article');
    item.className = 'form-panel';
    const title = document.createElement('h3');
    title.textContent = product.name || 'Unnamed product';
    const price = document.createElement('p');
    price.className = 'product-price';
    price.textContent = formatPrice(product.price) || 'No price set';
    const status = document.createElement('p');
    status.textContent = `Status: ${product.status === 'PUBLISHED' ? 'LIVE' : (product.status || 'UNKNOWN')}`;
    const edit = document.createElement('a');
    edit.className = 'button button--quiet';
    edit.href = `edit-product.html?id=${encodeURIComponent(product.id)}`;
    edit.textContent = 'Edit product';
    item.append(title, price, status, edit);
    productsRoot.append(item);
  });
}

function renderEnquiries(enquiries) {
  if (!enquiries.length) { showEmpty(enquiriesRoot, 'No enquiries yet. Customer enquiries will appear here.'); return; }
  enquiriesRoot.replaceChildren();
  enquiries.slice(0, 5).forEach((item) => {
    const card = document.createElement('article');
    card.className = 'form-panel';
    const title = document.createElement('h3');
    title.textContent = item.customerName || 'Customer enquiry';
    const product = document.createElement('p');
    product.textContent = `Product: ${item.productName || item.productId || 'Not specified'}`;
    const text = document.createElement('p');
    text.textContent = item.message || 'No message supplied.';
    const status = document.createElement('p');
    status.textContent = `Status: ${item.status || 'NEW'}`;
    card.append(title, product, text, status);
    enquiriesRoot.append(card);
  });
}

requireUser(async (user, profile) => {
  if (profile.role !== 'vendor') { location.href = '../index.html'; return; }
  try {
    const products = await ownedProducts(user.uid);
    let enquirySnapshot = await get(ref(database, `vendor_enquiries/${user.uid}`));
    if (!enquirySnapshot.exists()) {
      enquirySnapshot = await get(query(ref(database, 'enquiries'), orderByChild('vendorId'), equalTo(user.uid)));
    }
    const enquiries = enquirySnapshot.exists()
      ? Object.entries(enquirySnapshot.val()).map(([id, item]) => ({ id, ...item })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
      : [];
    renderStats(products, enquiries);
    renderProducts(products);
    renderEnquiries(enquiries);
  } catch (error) {
    console.error('Vendor dashboard load failed:', error);
    statsRoot.innerHTML = '<p class="error">We could not load your dashboard. Please refresh and try again.</p>';
    showError(productsRoot, 'We could not load your products right now.');
    showError(enquiriesRoot, 'We could not load your enquiries right now.');
    message.textContent = 'Dashboard data could not be loaded.';
  }
}, '../login.html', (error) => { console.error('Vendor authentication failed:', error); statsRoot.innerHTML = '<p class="error">We could not load your account. Please refresh and try again.</p>'; showError(productsRoot, 'Your products could not be loaded.'); showError(enquiriesRoot, 'Your enquiries could not be loaded.'); message.textContent = 'Your account could not be loaded.'; });
</script><script src="../js/brand-avatar.js"></script><script src="../js/theme.js"></script></body></html>
