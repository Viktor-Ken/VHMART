<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../css/main.css"><title>Vendor Profile | VHMART</title></head>
<body><main class="page"><a href="dashboard">Back to dashboard</a><section class="form-panel"><h1>Vendor profile</h1><form id="profileForm"><label for="businessName">Business name<input id="businessName" required></label><label for="description">Description<textarea id="description" maxlength="3000"></textarea></label><label for="countryCode">Country code<select id="countryCode" aria-label="Country dialling code"><option value="+234" selected>Nigeria +234</option><option value="+1">US & Canada +1</option><option value="+44">United Kingdom +44</option><option value="+233">Ghana +233</option><option value="+254">Kenya +254</option><option value="+27">South Africa +27</option><option value="+30">Greece +30</option><option value="+353">Ireland +353</option><option value="+91">India +91</option><option value="+55">Brazil +55</option><option value="+7">Russia +7</option></select></label><label for="phone">Phone<input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" required></label><label for="waCountryCode">WhatsApp country code<select id="waCountryCode" aria-label="WhatsApp country dialling code"><option value="+234" selected>Nigeria +234</option><option value="+1">US & Canada +1</option><option value="+44">United Kingdom +44</option><option value="+233">Ghana +233</option><option value="+254">Kenya +254</option><option value="+27">South Africa +27</option><option value="+30">Greece +30</option><option value="+353">Ireland +353</option><option value="+91">India +91</option><option value="+55">Brazil +55</option><option value="+7">Russia +7</option></select></label><label for="whatsapp">WhatsApp<input id="whatsapp" type="tel" inputmode="tel" autocomplete="tel-national"></label><label for="email">Email<input id="email" type="email" required readonly></label><label for="facebook">Facebook<input id="facebook" type="url" placeholder="https://facebook.com/yourpage"></label><label for="instagram">Instagram<input id="instagram" type="url" placeholder="https://instagram.com/yourpage"></label><label for="twitter">X (Twitter)<input id="twitter" type="url" placeholder="https://x.com/yourhandle"></label><label for="tiktok">TikTok<input id="tiktok" type="url" placeholder="https://tiktok.com/@yourhandle"></label><label for="youtube">YouTube<input id="youtube" type="url" placeholder="https://youtube.com/@yourhandle"></label><label for="linkedin">LinkedIn<input id="linkedin" type="url" placeholder="https://linkedin.com/company/yourcompany"></label><label for="website">Website<input id="website" type="url" placeholder="https://yourwebsite.com"></label><label for="categoryId">Category<select id="categoryId"><option value="hospital-lab-equipment">Hospital & lab equipment</option><option value="wellness">Wellness</option><option value="fitness">Fitness</option><option value="men-shoes">Men shoes</option><option value="women-shoes">Women shoes</option></select></label><button class="button button--primary">Save profile</button><p id="message" role="status"></p></form></section><div id="securityMount"></div></main>
<script type="module">
import { requireUser } from '../js/auth.js'; import { joinPhone, selectCountryFor } from '../js/contact-links.js'; import { database } from '../js/firebase.js'; import { get,ref,update,serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';
const form=document.querySelector('#profileForm'),message=document.querySelector('#message');
requireUser(async(user,profile)=>{
  const { renderPasswordForm, renderEmailForm } = await import('../js/profile-edit.js');
  const security=document.querySelector('#securityMount'); renderEmailForm(security); renderPasswordForm(security);
  if(profile.role!=='vendor'){location.href='../';return;}
  if(profile.deletedAt){location.href='deleted';return;}
  if(profile.status!=='ACTIVE'){location.href='pending';return;}
  const vendorId=profile.vendorId||user.uid; try{const s=await get(ref(database,`vendors/${vendorId}`));const v=s.val()||{};
    form.businessName.value=v.businessName||'';form.description.value=v.description||'';form.email.value=v.email||user.email||'';form.categoryId.value=v.categoryId||'wellness';
    for(const f of ['phone','whatsapp','facebook','instagram','twitter','tiktok','youtube','linkedin','website']){const el=document.querySelector(`#${f}`);if(el) el.value=v[f]||'';}
    selectCountryFor(form.countryCode,v.phone);selectCountryFor(form.waCountryCode,v.whatsapp);if(v.phone) form.phone.value=v.phone.replace(/^\+/, '');if(v.whatsapp) form.whatsapp.value=v.whatsapp.replace(/^\+/, '');
  }catch(e){message.textContent='Could not load profile.';return;}
  form.addEventListener('submit',async(ev)=>{ev.preventDefault();const b=form.querySelector('button');b.disabled=true;try{await update(ref(database,`vendors/${vendorId}`),{businessName:form.businessName.value.trim(),description:form.description.value.trim(),phone:joinPhone(form.countryCode,form.phone.value),whatsapp:joinPhone(form.waCountryCode,form.whatsapp.value),email:form.email.value.trim(),facebook:form.facebook.value.trim(),instagram:form.instagram.value.trim(),twitter:form.twitter.value.trim(),tiktok:form.tiktok.value.trim(),youtube:form.youtube.value.trim(),linkedin:form.linkedin.value.trim(),website:form.website.value.trim(),categoryId:form.categoryId.value,updatedAt:serverTimestamp()});message.textContent='Profile saved.';}catch(e){message.textContent='Could not save.';}finally{b.disabled=false;}});
},{loginPath:'../login'});
</script></body></html>
