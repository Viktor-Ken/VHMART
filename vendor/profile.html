</head><body><main class="page"><a href="dashboard.html">Back to dashboard</a><section class="form-panel"><h1>Vendor profile</h1><form id="profileForm"><label for="businessName">Business name<input id="businessName" required></label><label for="description">Description<textarea id="description" maxlength="3000"></textarea></label><label for="phone">Phone<input id="phone" type="tel"></label><label for="whatsapp">WhatsApp<input id="whatsapp" type="tel"></label><label for="email">Email<input id="email" type="email" required></label><label for="facebook">Facebook link<input id="facebook" type="url" placeholder="https://facebook.com/yourpage"></label><label for="instagram">Instagram link<input id="instagram" type="url" placeholder="https://instagram.com/yourpage"></label><label for="twitter">X (Twitter) link<input id="twitter" type="url" placeholder="https://x.com/yourhandle"></label><label for="tiktok">TikTok link<input id="tiktok" type="url" placeholder="https://tiktok.com/@yourhandle"></label><label for="youtube">YouTube link<input id="youtube" type="url" placeholder="https://youtube.com/@yourchannel"></label><label for="linkedin">LinkedIn link<input id="linkedin" type="url" placeholder="https://linkedin.com/in/yourname"></label><label for="website">Website link<input id="website" type="url" placeholder="https://yourwebsite.com"></label><label for="categoryId">Category<select id="categoryId"><option value="general">General</option><option value="books">Books</option><option value="courses">Courses</option><option value="hospital-wears">Hospital wears</option><option value="wellness">Wellness</option><option value="hospital-lab-equipment">Hospital & lab equipment</option><option value="health-travel">Health travel</option><option value="fitness">Fitness</option><option value="men-shoes">Men shoes</option><option value="women-shoes">Women shoes</option></select></label><button class="button button--primary">Save profile</button><p id="message" role="status"></p></form></section></main><script type="module">import { requireUser } from '../js/auth.js';import { database } from '../js/firebase.js';import { get,ref,update,serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';const form=document.querySelector('#profileForm'),message=document.querySelector('#message');requireUser(async(user,profile)=>{if(profile.role!=='vendor'){location.href='../index.html';return;}if(profile.deletedAt){location.href='deleted.html';return;}if(profile.status!=='ACTIVE'){location.href='pending.html';return;}const vendorId=profile.vendorId||user.uid;try{const snapshot=await get(ref(database,`vendors/${vendorId}`));const vendor=snapshot.val()||{};for(const field of ['businessName','description','phone','whatsapp','email','facebook','instagram','twitter','tiktok','youtube','linkedin','website','categoryId'])document.querySelector(`#${field}`).value=vendor[field]||'';}catch(error){message.textContent='We could not load your vendor profile. Please refresh and try again.';console.error(error);return;}form.addEventListener('submit',async(event)=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;try{await update(ref(database,`vendors/${vendorId}`),{businessName:form.businessName.value.trim(),description:form.description.value.trim(),phone:form.phone.value.trim(),whatsapp:form.whatsapp.value.trim(),email:form.email.value.trim(),facebook:form.facebook.value.trim(),instagram:form.instagram.value.trim(),twitter:form.twitter.value.trim(),tiktok:form.tiktok.value.trim(),youtube:form.youtube.value.trim(),linkedin:form.linkedin.value.trim(),website:form.website.value.trim(),categoryId:form.categoryId.value,updatedAt:serverTimestamp()});message.textContent='Profile saved.';}catch(error){message.textContent='Could not save your profile.';console.error(error);}finally{button.disabled=false;}});});</script><script src="../js/brand-avatar.js"></script><script src="../js/theme.js"></script><script src="../js/track.js"></script></body></html>
