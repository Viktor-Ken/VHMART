<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vendor registration | VHMART</title><link rel="stylesheet" href="../css/main.css"></head>
<body><main class="page"><a href="../index.html">Back to VHMART</a><section class="form-panel"><h1>Create vendor account</h1><p>Register and send your application for review. A VHMART admin approves every new vendor before the storefront opens.</p><form id="registerForm">
<label for="name">Contact name<input id="name" autocomplete="name" required maxlength="100"></label>
<label for="businessName">Business name<input id="businessName" required maxlength="120"></label>
<label for="email">Email<input id="email" type="email" autocomplete="email" required></label>
<label for="phone">Phone number<select id="countryCode" aria-label="Country dialling code"><option value="+234" selected>🇳🇬 Nigeria +234</option><option value="+1">🇺🇸 / 🇨🇦 US & Canada +1</option><option value="+233">🇬🇭 Ghana +233</option><option value="+44">🇬🇧 United Kingdom +44</option><option value="+254">🇰🇪 Kenya +254</option><option value="+27">🇿🇦 South Africa +27</option><option value="+30">🇬🇷 Greece +30</option><option value="+353">🇮🇪 Ireland +353</option><option value="+91">🇮🇳 India +91</option><option value="+55">🇧🇷 Brazil +55</option><option value="+7">🇷🇺 Russia +7</option></select><input id="phone" type="tel" autocomplete="tel" required maxlength="30" placeholder="e.g. 8027187963"></label>
<label for="categoryId">Category<select id="categoryId" required><option value="general">General</option><option value="books">Books</option><option value="courses">Courses</option><option value="hospital-wears">Hospital wears</option><option value="wellness">Wellness</option><option value="hospital-lab-equipment">Hospital & lab equipment</option><option value="health-travel">Health travel</option><option value="fitness">Fitness</option><option value="men-shoes">Men shoes</option><option value="women-shoes">Women shoes</option></select></label>
<label for="description">Business description<textarea id="description" maxlength="3000"></textarea></label>
<label for="password">Password<input id="password" type="password" autocomplete="new-password" minlength="8" required></label>
<button class="button button--primary" type="submit">Create vendor account</button><p id="message" role="status"></p></form><p>Already a vendor? <a href="../login.html">Sign in</a></p></section></main>
<script type="module">
import { auth, database } from '../js/firebase.js';
import { createUserWithEmailAndPassword, updateProfile, deleteUser } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js';
import { ref, update, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';
const form=document.querySelector('#registerForm'),message=document.querySelector('#message');
form.addEventListener('submit',async(e)=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;message.textContent='Sending your application...';let user=null;try{const credential=await createUserWithEmailAndPassword(auth,form.email.value.trim().toLowerCase(),form.password.value);user=credential.user;await updateProfile(user,{displayName:form.name.value.trim()});const now=serverTimestamp();const uid=user.uid;await update(ref(database,`users/${uid}`),{name:form.name.value.trim(),email:user.email,role:'vendor',active:true,vendorId:uid,createdAt:now,updatedAt:now});await update(ref(database,`vendors/${uid}`),{ownerUid:uid,businessName:form.businessName.value.trim(),contactName:form.name.value.trim(),email:user.email,phone:form.countryCode.value.trim()+form.phone.value.trim(),categoryId:form.categoryId.value,description:form.description.value.trim(),status:'PENDING',createdAt:now,updatedAt:now});location.href='dashboard.html';}catch(error){if(user){try{await deleteUser(user);}catch(cleanupError){console.error(cleanupError);}}const messages={'auth/email-already-in-use':'That email is already registered.','auth/operation-not-allowed':'Email/password sign-in is not enabled in Firebase Authentication. Enable Email/Password in Firebase Authentication.','auth/invalid-api-key':'The Firebase configuration is invalid.','auth/network-request-failed':'Network error. Check your internet connection and try again.','auth/weak-password':'Use a password with at least 8 characters.','auth/invalid-email':'Enter a valid email address.','PERMISSION_DENIED':'The account was created, but VHMART could not save the vendor profile. Check the Firebase Realtime Database rules.'};message.textContent=messages[error.code]||`We could not create your vendor account (${error.code||'unknown error'}). Please try again.`;console.error(error);button.disabled=false;}});
</script><script src="../js/brand-avatar.js"></script><script src="../js/theme.js"></script><script src="../js/track.js"></script></body></html>
