<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="css/main.css"><title>Vendor registration | VHMART</title></head>
<body><main class="page"><h1>Register as vendor</h1><section class="form-panel"><form id="reg"><label for="name">Contact name<input id="name" required></label><label for="businessName">Business name<input id="businessName" required></label><label for="email">Email<input id="email" type="email" required></label><label for="countryCode">Country code<select id="countryCode"><option value="+234" selected>Nigeria +234</option><option value="+1">US & Canada +1</option><option value="+44">UK +44</option><option value="+233">Ghana +233</option><option value="+254">Kenya +254</option><option value="+27">South Africa +27</option><option value="+30">Greece +30</option><option value="+353">Ireland +353</option><option value="+91">India +91</option><option value="+55">Brazil +55</option><option value="+7">Russia +7</option></select></label><label for="phone">Phone<input id="phone" type="tel" required></label><label for="password">Password<input id="password" type="password" required></label><label for="categoryId">Category<select id="categoryId"><option value="hospital-lab-equipment">Hospital & lab equipment</option><option value="wellness">Wellness</option><option value="fitness">Fitness</option><option value="men-shoes">Men shoes</option><option value="women-shoes">Women shoes</option></select></label><label for="description">Description<textarea id="description" maxlength="3000"></textarea></label><label><input type="checkbox" id="terms" required> I agree to Terms of Use</label><button class="button button--primary">Register</button><p id="m" role="status"></p></form></section></main>
<script type="module">
import { auth, database } from '../js/firebase.js'; import { createUserWithEmailAndPassword, updateProfile } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js'; import { ref, update, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js'; import { joinPhone } from '../js/contact-links.js';
const f=document.querySelector('#reg'),m=document.querySelector('#m');
f.addEventListener('submit',async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;try{const c=await createUserWithEmailAndPassword(auth,f.email.value.trim().toLowerCase(),f.password.value);const u=c.user;await updateProfile(u,{displayName:f.name.value.trim()});const now=serverTimestamp();await update(ref(database,`users/${u.uid}`),{name:f.name.value.trim(),email:u.email,role:'vendor',active:true,vendorId:u.uid,termsAcceptedAt:now,createdAt:now,updatedAt:now});await update(ref(database,`vendors/${u.uid}`),{ownerUid:u.uid,businessName:f.businessName.value.trim(),contactName:f.name.value.trim(),email:u.email,phone:joinPhone(f.countryCode,f.phone.value),categoryId:f.categoryId.value,description:f.description.value.trim(),status:'PENDING',createdAt:now,updatedAt:now});location.href='pending';}catch(err){m.textContent='Could not register. Please try again.';}finally{b.disabled=false;}});
</script></body></html>
