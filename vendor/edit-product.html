<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../css/main.css"><title>Edit product | VHMART</title></head>
<body><main class="page"><a href="dashboard">Back</a><h1>Edit product</h1><section class="form-panel"><form id="form"><label for="name">Name<input id="name" required></label><label for="price">Price<input id="price" type="number" min="0" step="0.01"></label><label for="image">Image URL<input id="image" type="url"></label><label for="categoryId">Category<select id="categoryId"><option value="hospital-lab-equipment">Hospital & lab equipment</option><option value="wellness">Wellness</option><option value="fitness">Fitness</option><option value="men-shoes">Men shoes</option><option value="women-shoes">Women shoes</option></select></label><label for="availability">Availability<select id="availability"><option value="In stock">In stock</option><option value="Out of stock">Out of stock</option><option value="Contact vendor">Contact vendor</option></select></label><label for="description">Description<textarea id="description"></textarea></label><label for="status">Status<select id="status"><option value="PUBLISHED">Published</option><option value="DRAFT">Draft</option><option value="UNPUBLISHED">Unpublished</option><option value="SOFT_DELETED">Soft deleted</option></select></label><button class="button button--primary">Save</button><p id="msg"></p></form><div class="button-row"><button type="button" id="del" class="button button--danger">Soft delete</button><button type="button" id="restore" class="button">Restore</button></div></section></main>
<script type="module">
import { requireUser } from '../js/auth.js'; import { database } from '../js/firebase.js'; import { get, ref, update, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';
const f=document.querySelector('#form'),m=document.querySelector('#msg'),del=document.querySelector('#del'),rest=document.querySelector('#restore'); const id=new URLSearchParams(location.search).get('id');
requireUser(async(user,p)=>{
  if(p.role!=='vendor'||p.status!=='ACTIVE'){location.href='../login';return;}
  const vid=p.vendorId||user.uid; if(!id){m.textContent='Missing product id.';return;}const rs=await get(ref(database,`products/${id}`));const prod=rs.val();if(!prod||prod.vendorId!==vid){m.textContent='Product not found.';return;}
  for(const k of ['name','image','categoryId','availability','description','status']) if(f[k]) f[k].value=prod[k]||''; if(f.price) f.price.value=prod.price==null?'':prod.price;
  f.addEventListener('submit',async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;try{const priceVal=f.price.value===''?null:Number(f.price.value);await update(ref(database,`products/${id}`),{name:f.name.value.trim(),price:priceVal,image:f.image.value.trim(),categoryId:f.categoryId.value,availability:f.availability.value,description:f.description.value.trim(),status:f.status.value,updatedAt:serverTimestamp()});m.textContent='Saved.';}catch(err){m.textContent='Failed.';}finally{b.disabled=false;}});
  del.addEventListener('click',async()=>{if(!confirm('Soft delete this product?'))return;await update(ref(database,`products/${id}`),{status:'SOFT_DELETED',deletedAt:serverTimestamp(),updatedAt:serverTimestamp()});location.href='dashboard';});
  rest.addEventListener('click',async()=>{await update(ref(database,`products/${id}`),{status:'PUBLISHED',deletedAt:null,updatedAt:serverTimestamp()});location.href='dashboard';});
},{loginPath:'../login'});
</script></body></html>
