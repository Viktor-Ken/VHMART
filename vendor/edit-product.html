</head><body><main class="page"><a href="products">Back to products</a><section class="form-panel"><h1>Edit product</h1><form id="productForm"><label for="name">Product name<input id="name" required maxlength="120"></label><label for="price">Price (₦)<input id="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="e.g. 15000"></label><label for="description">Description<textarea id="description" required minlength="10" maxlength="3000"></textarea></label><label for="categoryId">Category<select id="categoryId" required><option value="general">General</option><option value="books">Books</option><option value="courses">Courses</option><option value="hospital-wears">Hospital wears</option><option value="wellness">Wellness</option><option value="hospital-lab-equipment">Hospital & lab equipment</option><option value="health-travel">Health travel</option><option value="fitness">Fitness</option><option value="men-shoes">Men shoes</option><option value="women-shoes">Women shoes</option></select></label><label for="availability">Availability<select id="availability"><option value="AVAILABLE">Available</option><option value="CONTACT_VENDOR">Contact vendor</option><option value="UNAVAILABLE">Unavailable</option></select></label><label for="image">Replace image<input id="image" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="preview" alt="Selected product preview" hidden><button name="submitMode" value="submit" class="button button--primary">Publish product</button><p id="message" role="status"></p></form></section></main><script type="module" src="../js/vendor-product-form.js"></script><script src="../js/brand-avatar.js"></script><script src="../js/theme.js"></script><script src="../js/track.js"></script></body></html>
