</head><body><header class="site-header"><nav class="nav" aria-label="Main navigation"><a class="brand" href="index.html">VHMART</a><div class="nav-links"><a href="marketplace.html" aria-current="page">Marketplace</a><a href="categories.html">Categories</a><a href="login.html">Sign in</a></div></nav></header><main class="page"><div class="section-heading"><div><p>Marketplace</p><h1>Find your next useful thing.</h1></div></div><form id="filters" class="filter-bar" aria-label="Product filters"><label>Search products or vendors<input id="search" type="search" placeholder="Try scrubs, books, wellness..."></label><label>Category<select id="category"><option value="">All categories</option></select></label></form><p id="status" class="empty">Loading products...</p><div id="products" class="product-grid"></div></main><footer class="site-footer"><div class="page">Discover. View. Contact. VHMART connects people with vendors directly.</div></footer><script type="module">import { getPublishedProducts, categoryIds, productCard } from './js/marketplace.js';const query=new URLSearchParams(location.search),search=document.querySelector('#search'),category=document.querySelector('#category'),grid=document.querySelector('#products'),status=document.querySelector('#status');categoryIds.forEach((id)=>{const option=document.createElement('option');option.value=id;option.textContent=id.replaceAll('-',' ');category.append(option);});category.value=query.get('category')||'';let products=[];function render(){const term=search.value.trim().toLowerCase();const visible=products.filter((product)=>{const haystack=[product.name,product.description,product.vendorName,product.categoryId].join(' ').toLowerCase();return(!term||haystack.includes(term))&&(!category.value||product.categoryId===category.value);});grid.replaceChildren();status.hidden=Boolean(visible.length);status.textContent=products.length&&!visible.length?'No products match those filters.':'No products are available yet.';visible.forEach((product,index)=>grid.append(productCard(product,{priority:index<4})));}let frame=0;search.addEventListener('input',()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(render);});category.addEventListener('change',render);try{products=await getPublishedProducts();render();}catch(error){status.textContent='We could not load products right now. Please try again.';status.className='error';console.error(error);}</script><script src="js/brand-avatar.js"></script><script src="js/theme.js"></script><script src="js/session.js"></script><script src="js/track.js"></script></body></html>
