</head><body><main class="page"><a href="index.html">Back to VHMART</a><section class="form-panel"><h1>Sign in</h1><p>Access your VHMART account.</p><form id="loginForm"><label for="email">Email<input id="email" type="email" autocomplete="email" required></label><label for="password">Password<input id="password" type="password" autocomplete="current-password" minlength="8" required></label><button class="button button--primary" type="submit">Sign in</button><p id="message" role="status"></p></form><button id="googleBtn" class="button" type="button">Sign in with Google</button><p><a href="register.html">Create an account</a> · <a href="vendor/register.html">Register as a vendor</a> · <button id="reset" type="button">Reset password</button></p></section></main><script type="module">import { auth, database } from './js/firebase.js'; import { isAdmin } from './js/auth.js'; import { signInWithEmailAndPassword, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js'; import { get, ref, set, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js'; const form=document.querySelector('#loginForm'), message=document.querySelector('#message'), reset=document.querySelector('#reset'), googleBtn=document.querySelector('#googleBtn'); form.addEventListener('submit',async(event)=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;message.textContent='Signing in...';try{const credential=await signInWithEmailAndPassword(auth,form.email.value.trim(),form.password.value);const userSnapshot=await get(ref(database,`users/${credential.user.uid}`));const profile=userSnapshot.val()||{};if(await isAdmin(credential.user)){location.href='admin/dashboard.html';return;}if(profile.deletedAt||profile.active===false){location.href='account-deleted.html';return;}if(profile.role==='vendor'){location.href=profile.status==='ACTIVE'?'vendor/dashboard.html':'vendor/pending.html';return;}location.href='account.html';}catch(error){const messages={'auth/invalid-credential':'Incorrect email or password.','auth/user-not-found':'No account was found with that email.','auth/wrong-password':'Incorrect email or password.','auth/too-many-requests':'Too many attempts. Please wait and try again.','PERMISSION_DENIED':'Your account profile could not be loaded. Please contact support.'};message.textContent=messages[error.code]||'We could not sign you in. Check your details and try again.';console.error(error);button.disabled=false;}});googleBtn.addEventListener('click',async()=>{googleBtn.disabled=true;message.textContent='Signing in with Google...';try{const credential=await signInWithPopup(auth,new GoogleAuthProvider());const user=credential.user;const userRef=ref(database,`users/${user.uid}`);const userSnapshot=await get(userRef);const profile=userSnapshot.val()||{};if(!userSnapshot.exists()){await set(userRef,{name:(user.displayName||'').trim()||'Customer',email:user.email||'',role:'customer',active:true,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});}if(await isAdmin(user)){location.href='admin/dashboard.html';return;}location.href=profile.role==='vendor'?'vendor/dashboard.html':'index.html';}catch(error){const messages={'auth/popup-closed-by-user':'The Google sign-in window was closed.','auth/cancelled-popup-request':'The Google sign-in was cancelled.','auth/account-exists-with-different-credential':'An account already exists with this email. Sign in with your email and password instead.','PERMISSION_DENIED':'Your account profile could not be loaded. Please contact support.'};message.textContent=messages[error.code]||'We could not sign you in with Google. Please try again.';console.error(error);googleBtn.disabled=false;}});reset.addEventListener('click',async()=>{const email=form.email.value.trim();if(!email){message.textContent='Enter your email first.';return;}try{await sendPasswordResetEmail(auth,email);message.textContent='Password reset instructions sent.';}catch(error){message.textContent='We could not send the reset email.';console.error(error);}});</script><script src="js/brand-avatar.js"></script><script src="js/theme.js"></script><script src="js/track.js"></script></body></html>
