    <main class="page"><div class="section-heading"><div><p>Fresh from the marketplace</p><h1>Random picks</h1><p>Each reshuffle reveals a different selection of published products from VHMART vendors.</p></div><button id="reshuffle" class="button button--primary" type="button">Reshuffle</button></div><p id="status" class="empty">Loading products...</p><div id="products" class="product-grid"></div></main>
    <script type="module">
        import { getPublishedProducts, productCard } from './js/marketplace.js';
        const grid = document.querySelector('#products'); const status = document.querySelector('#status'); let products = [];
        function shuffle(items) { return [...items].sort(() => Math.random() - 0.5); }
        function render() { grid.replaceChildren(); const picks = shuffle(products).slice(0, 8); status.hidden = Boolean(picks.length); status.textContent = products.length ? 'No products are available for this selection.' : 'No published products are available yet.'; picks.forEach((product) => grid.append(productCard(product))); }
        document.querySelector('#reshuffle').addEventListener('click', render);
        try { products = await getPublishedProducts(); render(); } catch (error) { status.className = 'error'; status.textContent = 'We could not load products right now. Please try again.'; console.error(error); }
    </script>
