<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="css/main.css"><title>Contact vendor | VHMART</title></head>
<body><main class="page"><h1>Contact vendor</h1><div id="wrap" class="form-panel"><p class="empty">Loading...</p></div></main>
<script type="module">
import { database } from './js/firebase.js'; import { get, ref } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js'; import { contactChannels } from './js/contact-links.js';
const w=document.querySelector('#wrap'); const id=new URLSearchParams(location.search).get('id');
if(!id){w.textContent='Missing vendor id.';}else{try{const s=await get(ref(database,`vendors/${id}`));const v=s.val();if(!v||v.status!=='ACTIVE'){w.textContent='Vendor unavailable.';return;}w.replaceChildren();const h=document.createElement('h2');h.textContent=v.businessName||'Vendor';w.append(h);const p=document.createElement('p');p.textContent='Choose a channel. Accept terms before redirecting.';w.append(p);const tbox=document.createElement('div');tbox.className='contact-terms-box';const f=document.createElement('iframe');f.src='terms-and-conditions.html';f.title='Terms of Use';tbox.append(f);w.append(tbox);const lbl=document.createElement('label');lbl.className='contact-agree';const chk=document.createElement('input');chk.type='checkbox';const sp=document.createElement('span');sp.textContent='I agree to Terms of Use.';lbl.append(chk,sp);w.append(lbl);const err=document.createElement('p');err.className='error';err.hidden=true;err.textContent='Tick the box first.';w.append(err);const list=document.createElement('div');list.className='product-grid';const add=(lab,href)=>{if(!href)return;const a=document.createElement('a');a.className='button button--quiet';a.href=href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=lab;a.addEventListener('click',e=>{if(!chk.checked){e.preventDefault();err.hidden=false;chk.scrollIntoView({behavior:'smooth',block:'center'});}else err.hidden=true;});list.append(a);};for(const c of contactChannels(v)){add(c.key==='phone'?`Call ${c.raw}`:c.key==='email'?`Email ${c.raw}`:c.label,c.url);}w.append(list);}catch(e){w.textContent='Could not load vendor.';}}
</script></body></html>
