</head><body><main class="page"><a href="">Back to VHMART</a><section class="form-panel"><h1>Send an enquiry</h1><p>Ask the vendor about a product or service. VHMART does not process purchases.</p><form id="enquiryForm"><label for="name">Name<input id="name" autocomplete="name" required></label><label for="email">Email<input id="email" type="email" autocomplete="email" required></label><label for="phone">Phone<input id="phone" type="tel" autocomplete="tel"></label><label for="message">Message<textarea id="message" rows="6" minlength="10" required></textarea></label><button class="button button--primary" type="submit">Send enquiry</button><p id="status" role="status"></p></form></section></main><script type="module">import { auth, database } from './js/firebase.js'; import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js'; import { push, ref, serverTimestamp, set, get } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js'; const form=document.querySelector('#enquiryForm'),status=document.querySelector('#status'),params=new URLSearchParams(location.search); let user=null; onAuthStateChanged(auth,(current)=>{user=current;if(!current)status.textContent='Please sign in before sending an enquiry.';}); form.addEventListener('submit',async(event)=>{event.preventDefault();if(!user){location.href='login';return;}const button=form.querySelector('button');button.disabled=true;status.textContent='Sending...';try{const enquiry=push(ref(database,'enquiries'));const vendorId=params.get('vendorId')||null; const payload={productId:params.get('productId')||null,vendorId,customerUid:user.uid,customerName:form.name.value.trim(),customerEmail:form.email.value.trim(),customerPhone:form.phone.value.trim(),message:form.message.value.trim(),status:'NEW',createdAt:serverTimestamp(),updatedAt:serverTimestamp()}; await set(enquiry,payload); if(vendorId){ const enquiryRef=ref(database,`vendor_enquiries/${vendorId}/${enquiry.key}`); const existing=await get(enquiryRef).catch(()=>null); if(!existing||!existing.exists()){ await set(enquiryRef,payload).catch((mirrorError)=>{console.error('Mirror write failed (non-fatal):',mirrorError);}); } }form.reset();status.textContent='Your enquiry was sent to the vendor.';}catch(error){status.textContent='We could not send your enquiry. Please try again.';console.error(error);}finally{button.disabled=false;}});</script><script src="js/brand-avatar.js"></script><script src="js/theme.js"></script><script src="js/track.js"></script></body></html>
