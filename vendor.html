<script type="module">
import { database } from './js/firebase.js'; import { get, ref, query, orderByChild, equalTo } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';
const root = document.querySelector('#vendor'); const id = new URLSearchParams(location.search).get('id');
if (!id || !/^[A-Za-z0-9_-]{1,120}$/.test(id)) root.textContent = 'This vendor link is not valid.'; else { try { const [vendorSnap, productSnap] = await Promise.all([get(ref(database, `vendors/${id}`)), get(query(ref(database, 'products'), orderByChild('status'), equalTo('PUBLISHED')))]); const vendor = vendorSnap.val(); if (!vendor || vendor.status !== 'ACTIVE' || vendor.deletedAt) throw new Error('Vendor unavailable'); root.replaceChildren(); const title = document.createElement('h1'); title.textContent = vendor.businessName || 'VHMART vendor'; const description = document.createElement('p'); description.textContent = vendor.description || 'A VHMART marketplace vendor.'; const products = productSnap.exists() ? Object.entries(productSnap.val()).map(([productId, product]) => ({ productId, ...product })).filter((product) => product.vendorId === id && product.status === 'PUBLISHED') : []; const heading = document.createElement('h2'); heading.textContent = 'Products'; const grid = document.createElement('div'); grid.className = 'product-grid'; if (!products.length) { const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = 'This vendor has no products yet.'; grid.append(empty); } else products.forEach((product) => { const item = document.createElement('article'); item.className = 'form-panel'; const name = document.createElement('h3'); name.textContent = product.name || 'View product'; const price = document.createElement('p'); price.className = 'product-price'; price.textContent = (typeof product.price === 'number' && isFinite(product.price)) ? `₦${product.price.toLocaleString('en-NG', { maximumFractionDigits: 2 })}` : 'Contact vendor for price'; const link = document.createElement('a'); link.className = 'button button--quiet'; link.href = `product.html?id=${encodeURIComponent(product.productId)}`; link.textContent = 'View product'; item.append(name, price, link); grid.append(item); }); root.append(title, description, heading, grid); } catch (error) { root.textContent = 'This vendor is unavailable or could not be loaded.'; console.error(error); } }
</script><script src="js/brand-avatar.js"></script><script src="js/theme.js"></script><script src="js/track.js"></script></body></html>
