<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="css/main.css"><title>Vendor Storefront | VHMART</title></head>
<body><header class="site-header"><nav class="nav" aria-label="Main navigation"><a class="brand" href="">VHMART</a><div class="nav-links"><a href="marketplace">Marketplace</a><a href="login">Sign in</a></div></nav></header><main class="page"><a href="marketplace">Back to marketplace</a><h1 class="detail__title">Vendor storefront</h1><div id="vendor" class="detail"><p class="empty">Loading vendor...</p></div></main>
<script type="module">
import { database } from './js/firebase.js'; import { get, ref, query, orderByChild, equalTo } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js'; import { contactChannels } from './js/contact-links.js';
const root=document.querySelector('#vendor'); const id=new URLSearchParams(location.search).get('id');
if(!id||!/^[A-Za-z0-9_-]{1,120}$/.test(id)){root.textContent='Invalid vendor link.';}else{try{const [vSnap,pSnap]=await Promise.all([get(ref(database,`vendors/${id}`)),get(query(ref(database,'products'),orderByChild('status'),equalTo('PUBLISHED')))]);const vendor=vSnap.val();if(!vendor||vendor.status!=='ACTIVE'||vendor.deletedAt) throw new Error('unavailable');root.replaceChildren();const title=document.createElement('h1');title.textContent=vendor.businessName||'Vendor';const desc=document.createElement('p');desc.textContent=vendor.description||'';const prodHeading=document.createElement('h2');prodHeading.textContent='Products';const grid=document.createElement('div');grid.className='product-grid';const prods=pSnap.exists()?Object.entries(pSnap.val()).map(([pid,p])=>({pid,...p})).filter(p=>p.vendorId===id&&p.status==='PUBLISHED'):[];if(!prods.length){const e=document.createElement('p');e.className='empty';e.textContent='No products yet.';grid.append(e);}else prods.forEach(p=>{const a=document.createElement('article');a.className='form-panel';const h=document.createElement('h3');h.textContent=p.name||'View product';const pr=document.createElement('p');pr.className='product-price';pr.textContent=(typeof p.price==='number'&&isFinite(p.price))?`₦${p.price.toLocaleString('en-NG',{maximumFractionDigits:2})}`:'Contact vendor';const l=document.createElement('a');l.className='button button--quiet';l.href=`product?id=${encodeURIComponent(p.pid)}`;l.textContent='View product';a.append(h,pr,l);grid.append(a);});const cPanel=document.createElement('div');cPanel.className='contact-panel';const cHead=document.createElement('h2');cHead.textContent='Contact vendor';const termsLabel=document.createElement('p');termsLabel.textContent='Read Terms of Use and agree before redirecting to any external link.';const tbox=document.createElement('div');tbox.className='contact-terms-box';const tif=document.createElement('iframe');tif.src='terms-and-conditions.html';tif.title='Terms of Use';tif.loading='lazy';tbox.append(tif);const agree=document.createElement('label');agree.className='contact-agree';const chk=document.createElement('input');chk.type='checkbox';chk.id='agreeTerms';const at=document.createElement('span');at.textContent='I have read and agree to VHMART Terms of Use.';agree.append(chk,at);const warn=document.createElement('p');warn.className='error';warn.hidden=true;warn.textContent='Please tick the box before following a link.';const clist=document.createElement('div');clist.className='product-grid';const add=(lab,href)=>{if(!href)return;const b=document.createElement('a');b.className='button button--quiet';b.href=href;b.target='_blank';b.rel='noopener noreferrer';b.textContent=lab;b.addEventListener('click',ev=>{if(!chk.checked){ev.preventDefault();warn.hidden=false;chk.scrollIntoView({behavior:'smooth',block:'center'});return;}warn.hidden=true;});clist.append(b);};for(const ch of contactChannels(vendor)){add(ch.key==='phone'?`Call ${ch.raw}`:ch.key==='email'?`Email ${ch.raw}`:ch.label,ch.url);}chk.addEventListener('change',()=>{if(chk.checked) warn.hidden=true;});cPanel.append(cHead,termsLabel,tbox,agree,warn,clist);root.append(title,desc,cHead,cPanel,prodHeading,grid);}catch(e){root.textContent='Vendor unavailable.';console.error(e);}}
</script><script src="js/theme.js"></script></body></html>
