<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Moderate products | VHMART</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../css/main.css"></head><body><main class="page"><a href="dashboard.html">Back to admin dashboard</a><h1>Manage products</h1><div id="list"><p class="empty">Loading products...</p></div></main><script type="module">import { requireAdmin } from '../js/auth.js';import { database } from '../js/firebase.js';import { moderate } from '../js/admin.js';import { get,ref } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';requireAdmin(async(user,profile)=>{const root=document.querySelector('#list');try{const snapshot=await get(ref(database,'products'));root.replaceChildren();if(!snapshot.exists()){root.textContent='No products found.';return;}Object.entries(snapshot.val()).forEach(([id,product])=>{const card=document.createElement('article');card.className='form-panel';const title=document.createElement('h2');title.textContent=product.name||id;const status=document.createElement('p');status.textContent=`Status: ${product.status||'DRAFT'}`;const toggle=document.createElement('button');toggle.className='button button--quiet';toggle.textContent=product.status==='SUSPENDED'?'Reactivate':'Suspend';toggle.addEventListener('click',async()=>{const next=product.status==='SUSPENDED'?'PUBLISHED':'SUSPENDED';await moderate('products',id,next,user.uid);status.textContent=`Status: ${next}`;toggle.textContent=next==='SUSPENDED'?'Reactivate':'Suspend';});card.append(title,status,toggle);root.append(card);});}catch(error){console.error(error);root.replaceChildren();const message=document.createElement('p');message.className='error';message.textContent='Could not load products. Please refresh and try again.';root.append(message);}});</script><script src="../js/brand-avatar.js"></script><script src="../js/theme.js"></script><script src="../js/track.js"></script></body></html>
