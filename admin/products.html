<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moderate products | VHMART</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../css/main.css">
</head>
<body>
<main class="page">
  <a href="dashboard">Back to admin dashboard</a>
  <h1>Manage products</h1>
  <p class="empty" id="filter">
    <label for="statusFilter">Show
      <select id="statusFilter">
        <option value="all">All products</option>
        <option value="PUBLISHED">Published</option>
        <option value="SUSPENDED">Suspended</option>
        <option value="ARCHIVED">Archived</option>
        <option value="deleted">Deleted</option>
      </select>
    </label>
  </p>
  <div id="list"><p class="empty">Loading products...</p></div>
</main>
<script type="module">
// Admin product moderation.
//
// Delete is a soft delete: the record keeps its data and gains deletedAt, which
// the public read rule already excludes, so it leaves the marketplace immediately
// and can be restored. A hard remove() would destroy the row an audit trail and
// any live enquiry points at.
//
// The vendor's contact details are shown here so an admin can follow up on a
// listing directly. They are deliberately not shown to other customers - see
// js/contact-links.js for the sanitising that guards a vendor-supplied link.

import { requireAdmin } from '../js/auth.js';
import { database } from '../js/firebase.js';
import { moderate, softDelete, restore } from '../js/admin.js';
import { get, ref } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';
import { contactChannels } from '../js/contact-links.js';

const list = document.querySelector('#list');
const filter = document.querySelector('#statusFilter');

requireAdmin(async (user) => {
  const products = await loadProducts();
  const vendors = await loadVendors();
  render(products, vendors, user);

  filter.addEventListener('change', () => render(products, vendors, user));
});

async function loadProducts() {
  try {
    const snapshot = await get(ref(database, 'products'));
    if (!snapshot.exists()) return [];
    return Object.entries(snapshot.val()).map(([id, product]) => ({ id, ...product }));
  } catch (error) {
    console.error(error);
    list.replaceChildren();
    const message = document.createElement('p');
    message.className = 'error';
    message.textContent = 'Could not load products. Please refresh and try again.';
    list.append(message);
    return [];
  }
}

async function loadVendors() {
  try {
    const snapshot = await get(ref(database, 'vendors'));
    return snapshot.exists() ? snapshot.val() : {};
  } catch (error) {
    console.error(error);
    return {};
  }
}

function matches(product, selected) {
  if (selected === 'all') return true;
  if (selected === 'deleted') return Boolean(product.deletedAt);
  return product.status === selected && !product.deletedAt;
}

function render(products, vendors, user) {
  const rows = products.filter((product) => matches(product, filter.value));
  list.replaceChildren();

  if (!rows.length) {
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = 'No products in this view.';
    list.append(empty);
    return;
  }

  for (const product of rows) {
    list.append(card(product, vendors[product.vendorId], user));
  }
}

function card(product, vendor, user) {
  const article = document.createElement('article');
  article.className = 'form-panel';

  const title = document.createElement('h2');
  title.textContent = product.name || product.id;
  article.append(title);

  const status = document.createElement('p');
  const deleted = Boolean(product.deletedAt);
  status.textContent = deleted
    ? `Status: ${product.status || 'SUSPENDED'} - deleted ${new Date(product.deletedAt).toLocaleString()}`
    : `Status: ${product.status || 'DRAFT'}`;
  article.append(status);

  if (product.vendorId) {
    const owner = document.createElement('p');
    owner.textContent = `Vendor: ${vendor && vendor.businessName ? vendor.businessName : product.vendorId}`;
    article.append(owner);
  }

  // Contact details for the vendor behind this listing, so an admin can follow
  // up directly instead of only moderating blind.
  if (vendor) {
    const channels = contactChannels(vendor);
    const contact = document.createElement('p');
    if (channels.length) {
      contact.textContent = `Contact: ${channels.map((c) => `${c.label} ${c.raw}`).join(' | ')}`;
    } else {
      contact.textContent = 'Contact: none published by this vendor';
    }
    article.append(contact);
  }

  const actions = document.createElement('div');
  actions.className = 'button-row';

  if (deleted) {
    const restoreButton = button('Restore', 'button button--primary', async (event) => {
      event.target.disabled = true;
      try {
        await restore('products', product.id, user.uid);
        Object.assign(product, { status: 'ARCHIVED', deletedAt: null, deletedBy: '', deletedReason: '' });
        status.textContent = 'Status: ARCHIVED';
        article.replaceWith(card(product, vendor, user));
      } catch (error) {
        console.error(error);
        event.target.disabled = false;
        alert('Could not restore this product.');
      }
    });
    actions.append(restoreButton);
  } else {
    const toggle = button(product.status === 'SUSPENDED' ? 'Reactivate' : 'Suspend', 'button button--quiet', async (event) => {
      event.target.disabled = true;
      try {
        const next = product.status === 'SUSPENDED' ? 'PUBLISHED' : 'SUSPENDED';
        await moderate('products', product.id, next, user.uid);
        product.status = next;
        status.textContent = `Status: ${next}`;
        event.target.textContent = next === 'SUSPENDED' ? 'Reactivate' : 'Suspend';
      } catch (error) {
        console.error(error);
        event.target.disabled = false;
        alert('Could not change this product.');
      }
    });
    actions.append(toggle);

    const deleteButton = button('Delete', 'button button--danger', async (event) => {
      // Deliberately not window.confirm alone: deletion is reversible but it
      // takes the product off sale, so the reason is recorded for the audit log.
      const reason = window.prompt('Reason for deleting this product (kept on record)', 'Removed by admin');
      if (reason === null) return;
      event.target.disabled = true;
      try {
        await softDelete('products', product.id, user.uid, reason);
        article.remove();
      } catch (error) {
        console.error(error);
        event.target.disabled = false;
        alert('Could not delete this product.');
      }
    });
    actions.append(deleteButton);
  }

  article.append(actions);
  return article;
}

function button(label, className, onClick) {
  const el = document.createElement('button');
  el.type = 'button';
  el.className = className;
  el.textContent = label;
  el.addEventListener('click', onClick);
  return el;
}
</script>
<script src="../js/brand-avatar.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/track.js"></script>
</body>
</html>
