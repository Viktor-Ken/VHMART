<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Visitor analytics | VHMART</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../css/main.css"><script>(function(){try{var t=localStorage.getItem('vhmart-theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script></head>
<body><main class="page">
<p><a href="dashboard.html">← Admin dashboard</a></p>
<h1>Visitor analytics</h1>
<div class="button-row" style="margin:16px 0" id="ranges">
  <button type="button" class="button button--primary" data-days="7">Last 7 days</button>
  <button type="button" class="button button--quiet" data-days="30">Last 30 days</button>
  <button type="button" class="button button--quiet" data-days="90">Last 90 days</button>
</div>
<div id="totals" class="category-grid"><p class="empty">Loading traffic...</p></div>
<p id="clock" class="chart-clock" role="status"></p>
<h2>Traffic</h2>
<div id="chart" class="form-panel"><p class="empty">Loading chart...</p></div>
<div class="form-panel" style="margin-top:16px"><h2>Top pages</h2><p class="chart-note">Based on the most recent 1,000 page views.</p><div id="pages"><p class="empty">Loading...</p></div></div>
</main>
<script type="module">
import { requireUser } from '../js/auth.js';
import { database } from '../js/firebase.js';
import { get, ref, query, limitToLast } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';
import { recentTraffic, londonDay, londonClock } from '../js/analytics.js';
import { barChart } from '../js/traffic-chart.js';

let days = 30;

function card(label, value) {
  const box = document.createElement('article');
  box.className = 'category-card';
  box.style.backgroundImage = 'linear-gradient(135deg,#176b55,#e76f51)';
  const heading = document.createElement('h3');
  heading.textContent = `${label}: ${value}`;
  box.append(heading);
  return box;
}

function topPages(rows) {
  const root = document.querySelector('#pages');
  root.replaceChildren();
  if (!rows.length) { const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = 'No page data yet.'; root.append(empty); return; }
  rows.forEach((row) => {
    const line = document.createElement('p');
    line.textContent = `${row.path} — ${row.hits} view${row.hits === 1 ? '' : 's'}`;
    root.append(line);
  });
}

async function load() {
  const totals = document.querySelector('#totals');
  totals.textContent = 'Loading traffic...';
  try {
    const series = await recentTraffic(days);
    const totalViews = series.reduce((sum, row) => sum + row.views, 0);
    const totalVisitors = series.reduce((sum, row) => sum + row.visitors, 0);
    const todayKey = londonDay();
    const today = series.find((row) => row.day === todayKey) || { views: 0, visitors: 0 };
    totals.replaceChildren(
      card('Visitors today', today.visitors),
      card('Page views today', today.views),
      card(`Visitors (${days} days, counted per day)`, totalVisitors),
      card(`Page views (${days} days)`, totalViews)
    );
    barChart(series);

    const snapshot = await get(query(ref(database, 'analytics/page_views'), limitToLast(1000)));
    const counts = new Map();
    if (snapshot.exists()) {
      snapshot.forEach((value) => {
        const path = value.child('path').val() || '/';
        counts.set(path, (counts.get(path) || 0) + 1);
      });
    }
    topPages(Array.from(counts.entries()).map(([path, hits]) => ({ path, hits })).sort((a, b) => b.hits - a.hits).slice(0, 10));
  } catch (error) {
    console.error(error);
    totals.textContent = 'Could not load traffic. Please refresh and try again.';
    barChart([]);
  }
}

// Counters reset at London midnight. The clock shows London time on a 24-hour clock,
// and the figures reload by themselves when London's date changes.
let shownDay = londonDay();
function tick() {
  const now = londonDay();
  document.querySelector('#clock').textContent = `London time ${londonClock()} (24-hour) · today is ${now} · the daily counters reset at 00:00 London time`;
  if (now !== shownDay) { shownDay = now; load(); }
}
tick(); setInterval(tick, 30000);

document.querySelectorAll('[data-days]').forEach((el) => {
  el.addEventListener('click', () => {
    days = Number(el.dataset.days);
    document.querySelectorAll('[data-days]').forEach((other) => {
      other.className = 'button ' + (other === el ? 'button--primary' : 'button--quiet');
    });
    load();
  });
});

requireUser(async (user, profile) => {
  if (profile.role !== 'admin') { location.href = '../index.html'; return; }
  load();
}, 'login.html', () => { document.querySelector('#totals').textContent = 'Could not load traffic.'; });
</script><script src="../js/brand-avatar.js"></script><script src="../js/theme.js"></script><script src="../js/track.js"></script></body></html>
