<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vendors | VHMART</title><link rel="stylesheet" href="../css/main.css"></head><body><main class="page"><p><a href="dashboard.html">← Admin dashboard</a></p><h1>Vendors</h1><p>Vendors can register and publish products without approval. You can suspend or reactivate an account here.</p><div id="list"><p class="empty">Loading vendors...</p></div></main><script type="module">import { requireUser } from '../js/auth.js';import { database } from '../js/firebase.js';import { get,ref,update,serverTimestamp,query,orderByChild,equalTo } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';requireUser(async(user,profile)=>{if(profile.role!=='admin'){location.href='../index.html';return;}const list=document.querySelector('#list');try{const snapshot=await get(ref(database,'vendors'));list.replaceChildren();if(!snapshot.exists()){list.textContent='No vendors found.';return;}Object.entries(snapshot.val()).forEach(([id,vendor])=>{const card=document.createElement('article');card.className='form-panel';const title=document.createElement('h2');title.textContent=vendor.businessName||'Unnamed vendor';const details=document.createElement('p');details.textContent=`${vendor.contactName||''} · ${vendor.email||''} · ${vendor.phone||''}`;const status=document.createElement('p');status.textContent=`Status: ${vendor.status||'ACTIVE'}`;const button=document.createElement('button');button.className='button '+(vendor.status==='SUSPENDED'?'button--primary':'button--quiet');button.textContent=vendor.status==='SUSPENDED'?'Reactivate':'Suspend';button.addEventListener('click',async()=>{button.disabled=true;const next=vendor.status==='SUSPENDED'?'ACTIVE':'SUSPENDED';try{const productsSnapshot=await get(query(ref(database,'products'),orderByChild('vendorId'),equalTo(id)));const updates={};updates[`vendors/${id}`]={...vendor,status:next,updatedAt:serverTimestamp()};if(productsSnapshot.exists()){Object.entries(productsSnapshot.val()).forEach(([productId,product])=>{if(next==='SUSPENDED'&&product.status==='PUBLISHED')updates[`products/${productId}`]={status:'SUSPENDED',vendorSuspended:true,updatedAt:serverTimestamp()};else if(next==='ACTIVE'&&product.status==='SUSPENDED'&&product.vendorSuspended===true)updates[`products/${productId}`]={status:'PUBLISHED',vendorSuspended:false,updatedAt:serverTimestamp()};});}await update(ref(database),updates);status.textContent=`Status: ${next}`;button.textContent=next==='SUSPENDED'?'Reactivate':'Suspend';button.className='button '+(next==='SUSPENDED'?'button--primary':'button--quiet');vendor.status=next;}catch(error){console.error(error);status.textContent='Could not update this vendor. Please try again.';}finally{button.disabled=false;}});card.append(title,details,status,button);list.append(card);});}catch(error){console.error(error);list.textContent='Could not load vendors. Please refresh and try again.';}});</script><script src="../js/brand-avatar.js"></script><script src="../js/theme.js"></script><script src="../js/track.js"></script></body></html>
