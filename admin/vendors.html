<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vendors | VHMART</title><link rel="stylesheet" href="../css/main.css"></head>
<body><main class="page">
<p><a href="dashboard.html">← Admin dashboard</a></p>
<h1>Vendors</h1>
<p>Every new vendor application has to be approved here before the vendor can publish products. Suspending or deleting a vendor hides their storefront but keeps the record.</p>
<div id="list"><p class="empty">Loading vendors...</p></div>
</main>
<script type="module">
import { requireAdmin } from '../js/auth.js';
import { database } from '../js/firebase.js';
import { push, get, ref, update, remove, serverTimestamp, query, orderByChild, equalTo } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';

requireAdmin(async (user, profile) => {const list = document.querySelector('#list');

  async function log(action, target, detail) {
    const entry = { actor: user.uid, action, target, detail: detail || '', timestamp: serverTimestamp() };
    await update(push(ref(database, 'audit_logs')), entry);
  }

  // Realtime Database rules only cascade downwards, so a multi-path update scoped
// at the database root is rejected even when every child path is individually
// writable. Every write below therefore targets its own exact path. The order is
// chosen so a partial failure always leaves the vendor with LESS access.
async function applyInOrder(entries) {
  for (const [path, value] of entries) {
    await update(ref(database, path), value);
  }
}

async function syncProducts(vendorId, vendorStatus) {
    const snapshot = await get(query(ref(database, 'products'), orderByChild('vendorId'), equalTo(vendorId)));
    const updates = [];
    if (snapshot.exists()) {
      Object.entries(snapshot.val()).forEach(([productId, product]) => {
        if (vendorStatus === 'SUSPENDED' && product.status === 'PUBLISHED' && !product.deletedAt) {
          updates.push([`products/${productId}`, { status: 'SUSPENDED', vendorSuspended: true, updatedAt: serverTimestamp() }]);
        } else if (vendorStatus === 'ACTIVE' && product.status === 'SUSPENDED' && product.vendorSuspended === true) {
          updates.push([`products/${productId}`, { status: 'PUBLISHED', vendorSuspended: false, updatedAt: serverTimestamp() }]);
        }
      });
    }
    return updates;
  }

  function button(label, className, handler) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'button ' + className;
    el.textContent = label;
    el.addEventListener('click', handler);
    return el;
  }

  function render(id, vendor) {
    const card = document.createElement('article');
    card.className = 'form-panel';

    const title = document.createElement('h2');
    title.textContent = vendor.businessName || 'Unnamed vendor';

    const details = document.createElement('p');
    details.textContent = `${vendor.contactName || ''} · ${vendor.email || ''} · ${vendor.phone || ''}`;

    const status = document.createElement('p');
    status.textContent = `Status: ${vendor.status || 'ACTIVE'}`;

    card.append(title, details, status);

    if (vendor.declinedReason) {
      const reason = document.createElement('p');
      reason.textContent = 'Decline reason: ' + vendor.declinedReason;
      card.append(reason);
    }

    const actions = document.createElement('div');
    actions.className = 'button-row';

    if (vendor.status === 'PENDING') {
      actions.append(
        button('Approve', 'button--primary', async (event) => {
          event.target.disabled = true;
          try {
            const productUpdates = await syncProducts(id, 'ACTIVE');
            await applyInOrder([
              [`users/${id}`, { active: true, updatedAt: serverTimestamp() }],
              [`vendors/${id}`, { status: 'ACTIVE', declinedReason: '', updatedAt: serverTimestamp() }],
              ...productUpdates
            ]);
            await log('approve_vendor', id);
            status.textContent = 'Status: ACTIVE';
            card.replaceChildren(title, details, status);
            render(id, { ...vendor, status: 'ACTIVE', declinedReason: '' });
          } catch (error) { console.error(error); status.textContent = 'Could not approve this vendor. Please try again.'; }
        }),
        button('Decline', 'button--danger', async (event) => {
          const reason = window.prompt('Reason for declining this vendor application', 'Does not meet VHMART vendor criteria');
          if (reason === null) return;
          event.target.disabled = true;
          try {
            await update(ref(database, `vendors/${id}`), { status: 'DECLINED', declinedReason: reason, updatedAt: serverTimestamp() });
            await log('decline_vendor', id, reason);
            status.textContent = 'Status: DECLINED';
            render(id, { ...vendor, status: 'DECLINED', declinedReason: reason });
          } catch (error) { console.error(error); status.textContent = 'Could not decline this vendor. Please try again.'; }
        })
      );
    } else if (vendor.status === 'ACTIVE') {
      actions.append(button('Suspend', 'button--quiet', async (event) => {
        event.target.disabled = true;
        try {
            const productUpdates = await syncProducts(id, 'SUSPENDED');
            await applyInOrder([
              [`vendors/${id}`, { status: 'SUSPENDED', updatedAt: serverTimestamp() }],
              ...productUpdates
            ]);
          await log('suspend_vendor', id);
          render(id, { ...vendor, status: 'SUSPENDED' });
        } catch (error) { console.error(error); status.textContent = 'Could not suspend this vendor. Please try again.'; }
      }));
    } else if (vendor.status === 'SUSPENDED') {
      actions.append(button('Reactivate', 'button--primary', async (event) => {
        event.target.disabled = true;
        try {
            const productUpdates = await syncProducts(id, 'ACTIVE');
            await applyInOrder([
              [`vendors/${id}`, { status: 'ACTIVE', updatedAt: serverTimestamp() }],
              ...productUpdates
            ]);
          await log('reactivate_vendor', id);
          render(id, { ...vendor, status: 'ACTIVE' });
        } catch (error) { console.error(error); status.textContent = 'Could not reactivate this vendor. Please try again.'; }
      }));
    }

    if (vendor.status !== 'PENDING') {
      actions.append(button('Delete account', 'button--danger', async (event) => {
        const ok = window.confirm('Delete this vendor account? Their storefront and products will be hidden, but the record is kept for legal purposes. An admin can restore it later.');
        if (!ok) return;
        event.target.disabled = true;
        try {
            const productUpdates = await syncProducts(id, 'SUSPENDED');
            const snapshot = await get(query(ref(database, 'products'), orderByChild('vendorId'), equalTo(id)));
            const hideUpdates = [];
            if (snapshot.exists()) {
              Object.entries(snapshot.val()).forEach(([productId, product]) => {
                if (!product.deletedAt) hideUpdates.push([`products/${productId}`, { status: 'SUSPENDED', deletedAt: serverTimestamp(), deletedBy: user.uid, updatedAt: serverTimestamp() }]);
              });
            }
            await applyInOrder([
              [`users/${id}`, { active: false, deletedAt: serverTimestamp(), deletedBy: user.uid, updatedAt: serverTimestamp() }],
              [`vendors/${id}`, { status: 'SUSPENDED', deletedAt: serverTimestamp(), deletedBy: user.uid, updatedAt: serverTimestamp() }],
              ...hideUpdates,
              ...productUpdates.filter(([path]) => !hideUpdates.some(([hidden]) => hidden === path))
            ]);
          await log('delete_vendor', id);
          card.remove();
        } catch (error) { console.error(error); status.textContent = 'Could not delete this vendor. Please try again.'; }
      }));
    }

    card.append(actions);
    return card;
  }

  try {
    const snapshot = await get(ref(database, 'vendors'));
    list.replaceChildren();
    if (!snapshot.exists()) { list.textContent = 'No vendors found.'; return; }
    const entries = Object.entries(snapshot.val())
      .filter(([, vendor]) => !vendor.deletedAt)
      .sort((a, b) => (a[1].status === 'PENDING' ? -1 : 0) - (b[1].status === 'PENDING' ? -1 : 0));
    if (!entries.length) { list.textContent = 'No vendors found.'; return; }
    entries.forEach(([id, vendor]) => list.append(render(id, vendor)));
  } catch (error) {
    console.error(error);
    list.textContent = 'Could not load vendors. Please refresh and try again.';
  }
});
</script><script src="../js/brand-avatar.js"></script><script src="../js/theme.js"></script><script src="../js/track.js"></script></body></html>
