<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage categories | VHMART</title><link rel="stylesheet" href="../css/main.css"></head><body><main class="page"><a href="dashboard.html">Back to admin dashboard</a><h1>Categories</h1><form id="categoryForm" class="form-panel"><label for="name">Category name<input id="name" required></label><label for="slug">Canonical ID<input id="slug" pattern="[a-z0-9-]+" required></label><button class="button button--primary">Create category</button><p id="message" role="status"></p></form><div id="list"></div></main><script type="module">import { requireUser } from '../js/auth.js';import { database } from '../js/firebase.js';import { get,push,ref,set } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';const form=document.querySelector('#categoryForm');requireUser(async(user,profile)=>{if(profile.role!=='admin'){location.href='../index.html';return;}form.addEventListener('submit',async(event)=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;try{await set(push(ref(database,'categories')),{name:form.name.value.trim(),slug:form.slug.value.trim(),active:true,sortOrder:Date.now()});form.reset();document.querySelector('#message').textContent='Category created.';}catch(error){document.querySelector('#message').textContent='Could not create category.';console.error(error);}finally{button.disabled=false;}});});</script><script src="../js/brand-avatar.js"></script><script src="../js/theme.js"></script></body></html>
