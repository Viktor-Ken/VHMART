<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reports | VHMART</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../css/main.css"></head><body><main class="page"><a href="dashboard.html">Back to admin dashboard</a><h1>Reports</h1><div id="list"><p class="empty">Loading reports...</p></div></main><script type="module">import { requireAdmin } from '../js/auth.js';import { database } from '../js/firebase.js';import { get,ref,update } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';requireAdmin(async(user,profile)=>{const root=document.querySelector('#list');try{const snapshot=await get(ref(database,'reports'));root.replaceChildren();if(!snapshot.exists()){root.textContent='No reports found.';return;}Object.entries(snapshot.val()).forEach(([id,report])=>{const card=document.createElement('article');card.className='form-panel';const title=document.createElement('h2');title.textContent=`${report.targetType||'Report'}: ${report.reason||'No reason supplied'}`;const button=document.createElement('button');button.className='button button--primary';button.textContent='Resolve';button.addEventListener('click',async()=>{button.disabled=true;await update(ref(database,`reports/${id}`),{status:'RESOLVED',resolvedBy:user.uid,updatedAt:Date.now()});button.textContent='Resolved';});card.append(title,button);root.append(card);});}catch(error){console.error(error);root.replaceChildren();const message=document.createElement('p');message.className='error';message.textContent='Could not load reports. Please refresh and try again.';root.append(message);}});</script><script src="../js/brand-avatar.js"></script><script src="../js/theme.js"></script><script src="../js/track.js"></script></body></html>
