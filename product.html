<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="VHMART product details and vendor contact."><title>Product | VHMART</title><link rel="stylesheet" href="css/main.css"></head>
<body><header class="site-header"><nav class="nav" aria-label="Main navigation"><a class="brand" href="index.html">VHMART</a><div class="nav-links"><a href="marketplace.html">Marketplace</a><a href="login.html">Sign in</a></div></nav></header><main class="page"><a href="marketplace.html">Back to marketplace</a><div id="detail" class="detail"><p class="empty">Loading product...</p></div></main>
<script type="module">
// Product page.
//
// A customer who likes a product clicks "I'm interested" and goes to the vendor's
// profile, where they choose to contact the vendor or make an enquiry. Contacting a
// vendor needs the terms accepted first, and that happens on the profile page.
import { database } from './js/firebase.js';
import { get, ref } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';
import { getProductById, formatPrice, text } from './js/marketplace.js';

const root = document.querySelector('#detail');
const id = new URLSearchParams(location.search).get('id');

function el(tag, className, content) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (content != null) node.textContent = content;
  return node;
}

if (!id || !/^[A-Za-z0-9_-]{1,120}$/.test(id)) {
  root.textContent = 'This product link is not valid.';
} else {
  try {
    const product = await getProductById(id);
    if (!product) throw new Error('Product unavailable');
    document.title = `${product.name || 'Product'} | VHMART`;

    // The vendor's name is a nicety; the page still works if it cannot be read.
    let vendor = null;
    if (product.vendorId) {
      try { vendor = (await get(ref(database, `vendors/${product.vendorId}`))).val(); } catch (error) { console.warn('Vendor lookup failed:', error); }
    }

    const image = el('img');
    image.src = text(product.image, 'Visuamall/bgg3.avif');
    image.alt = text(product.name, 'Product image');

    const content = el('div');
    const meta = [text(product.categoryId, 'general').replaceAll('-', ' '), text(product.availability, 'Contact vendor').replaceAll('_', ' '), vendor ? text(vendor.businessName, 'VHMART vendor') : 'By a VHMART vendor'].join(' | ');
    content.append(
      el('h1', null, text(product.name, 'Product')),
      el('p', 'product-price', formatPrice(product.price) || 'Contact vendor for price'),
      el('p', null, meta),
      el('p', null, text(product.description, 'Ask the vendor for more information about this product.'))
    );

    const action = el('a', 'button button--primary', 'I’m interested – view vendor');
    action.href = product.vendorId
      ? `vendor-profile.html?id=${encodeURIComponent(product.vendorId)}&product=${encodeURIComponent(id)}`
      : 'contact.html';
    content.append(action);
    if (product.vendorId) content.append(el('p', 'form-note', 'On the vendor’s page you can contact them directly or send an enquiry.'));

    root.replaceChildren(image, content);
  } catch (error) {
    root.textContent = 'This product is unavailable or could not be loaded.';
    console.error(error);
  }
}
</script><script src="js/brand-avatar.js"></script><script src="js/theme.js"></script></body></html>
