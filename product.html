<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="VHMART product details and vendor contact."><title>Product | VHMART</title><link rel="stylesheet" href="css/main.css"></head>
<body><header class="site-header"><nav class="nav" aria-label="Main navigation"><a class="brand" href="">VHMART</a><div class="nav-links"><a href="marketplace">Marketplace</a><a href="login">Sign in</a></div></nav></header><main class="page"><a href="marketplace">Back to marketplace</a><div id="detail" class="detail"><p class="empty">Loading product...</p></div></main>
<script type="module">
import { database } from './js/firebase.js'; import { get, ref } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js'; import { getProductById } from './js/marketplace.js';
const root = document.querySelector('#detail'); const id = new URLSearchParams(location.search).get('id');
if (!id || !/^[A-Za-z0-9_-]{1,120}$/.test(id)) { root.textContent = 'This product link is not valid.'; } else {
  // This page reads live data, so the copy below is a placeholder. Point the

  try { const product = await getProductById(id); if (!product) throw new Error('Product unavailable'); document.title = `${product.name || 'Product'} | VHMART`; const vendor = product.vendorId ? (await get(ref(database, `vendors/${product.vendorId}`))).val() : null; root.replaceChildren(); const image = document.createElement('img'); image.src = product.image || 'Visuamall/bgg3.avif'; image.alt = product.name || 'Product image'; const content = document.createElement('div'); const title = document.createElement('h1'); title.textContent = product.name || 'Product'; const price = document.createElement('p'); price.className = 'product-price'; const priceText = (typeof product.price === 'number' && isFinite(product.price)) ? `₦${product.price.toLocaleString('en-NG', { maximumFractionDigits: 2 })}` : ''; price.textContent = priceText || 'Contact vendor for price'; const description = document.createElement('p'); description.textContent = product.description || 'Ask the vendor for more information about this product.'; const meta = document.createElement('p'); meta.textContent = `${product.categoryId || 'General'} | ${product.availability || 'Contact vendor'} | ${vendor ? (vendor.businessName || 'VHMART vendor') : 'By a VHMART vendor'}`; const contact = document.createElement('button'); contact.type = 'button'; contact.className = 'button button--primary'; contact.textContent = 'Contact vendor'; const contactPanel = document.createElement('div'); contactPanel.className = 'contact-panel'; contactPanel.hidden = true; const termsLabel = document.createElement('p'); termsLabel.className = 'contact-terms-label'; termsLabel.textContent = 'Before continuing to a vendor on social media, please read the VHMART Terms of Use below and confirm you agree.'; const termsBox = document.createElement('div'); termsBox.className = 'contact-terms-box'; const termsFrame = document.createElement('iframe'); termsFrame.src = 'terms-and-conditions.html'; termsFrame.title = 'VHMART Terms of Use'; termsFrame.loading = 'lazy'; termsBox.append(termsFrame); const agreeLabel = document.createElement('label'); agreeLabel.className = 'contact-agree'; const agreeCheck = document.createElement('input'); agreeCheck.type = 'checkbox'; agreeCheck.id = 'agreeTerms'; agreeCheck.required = true; const agreeText = document.createElement('span'); agreeText.textContent = 'I have read and I agree to the VHMART Terms of Use.'; agreeLabel.append(agreeCheck, agreeText); const termsWarning = document.createElement('p'); termsWarning.className = 'error'; termsWarning.hidden = true; termsWarning.textContent = 'Please tick the box to confirm you agree to the Terms of Use before being redirected.'; const contactList = document.createElement('div'); contactList.className = 'product-grid'; const addLink = (label, href) => { if (!href) return; const button = document.createElement('a'); button.className = 'button button--quiet'; button.href = href; button.target = '_blank'; button.rel = 'noopener noreferrer'; button.textContent = label; button.addEventListener('click', (event) => { if (!agreeCheck.checked) { event.preventDefault(); termsWarning.hidden = false; agreeCheck.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; } termsWarning.hidden = true; }); contactList.append(button); }; if (vendor) { if (vendor.phone) addLink(`Call ${vendor.phone}`, `tel:${vendor.phone.replace(/[^+\d]/g, '')}`); if (vendor.email) addLink(`Email ${vendor.email}`, `mailto:${vendor.email}`); if (vendor.whatsapp) addLink('WhatsApp chat', `https://wa.me/${vendor.whatsapp.replace(/[^+\d]/g, '').replace('+', '')}`); const socials = [['Facebook', vendor.facebook], ['Instagram', vendor.instagram], ['X (Twitter)', vendor.twitter], ['TikTok', vendor.tiktok], ['YouTube', vendor.youtube], ['LinkedIn', vendor.linkedin], ['Website', vendor.website]]; socials.forEach(([label, value]) => { if (typeof value === 'string' && value.trim()) addLink(label, value.trim().startsWith('http') ? value.trim() : `https://${value.trim()}`); }); } const enqBtn = document.createElement('a'); enqBtn.className='button button--quiet'; enqBtn.href = enquiry.html?productId=&vendorId=; enqBtn.textContent='Send an enquiry'; contactList.append(enqBtn); const vbtn = document.createElement('a'); vbtn.className='button button--quiet'; vbtn.href = endor.html?id=; vbtn.textContent='Contact vendor'; contactList.append(vbtn); option omitted. agreeCheck.addEventListener('change', () => { if (agreeCheck.checked) termsWarning.hidden = true; }); contact.addEventListener('click', () => { contactPanel.hidden = !contactPanel.hidden; if (!contactPanel.hidden) agreeCheck.focus(); }); contactPanel.append(termsLabel, termsBox, agreeLabel, termsWarning, contactList); const vendorLink = document.createElement('a'); vendorLink.className = 'button button--quiet'; vendorLink.href = `vendor?id=${encodeURIComponent(product.vendorId || '')}`; vendorLink.textContent = 'View vendor'; content.append(title, price, meta, description, contact, contactPanel, vendorLink); root.append(image, content); } catch (error) { root.textContent = 'This product is unavailable or could not be loaded.'; console.error(error); } }
