<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="css/main.css"><title>Send enquiry | VHMART</title></head>
<body><header class="site-header"><nav class="nav" aria-label="Main navigation"><a class="brand" href="">VHMART</a><div class="nav-links"><a href="marketplace">Marketplace</a><a href="login">Sign in</a></div></nav></header><main class="page"><h1>Send enquiry</h1><section class="form-panel"><form id="enq"><label for="name">Your name<input id="name" required></label><label for="message">Message<textarea id="message" required maxlength="2000"></textarea></label><label for="replyType">How would you like to be contacted<select id="replyType"><option value="whatsapp">WhatsApp</option><option value="email">Email</option><option value="phone">Phone</option></select></label><label for="replyValue">Contact details<input id="replyValue" required></label><button class="button button--primary">Send enquiry</button><p id="m" role="status"></p></form></section></main>
<script type="module">
import { requireUser } from './js/auth.js'; import { database } from './js/firebase.js'; import { push, ref, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';
const f=document.querySelector('#enq'),m=document.querySelector('#m'); const pid=new URLSearchParams(location.search).get('productId'),vid=new URLSearchParams(location.search).get('vendorId');
requireUser(async(user,p)=>{f.addEventListener('submit',async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;try{await push(ref(database,'enquiries'),{productId:pid||'',vendorId:vid||'',customerId:user.uid,customerName:f.name.value.trim(),message:f.message.value.trim(),replyType:f.replyType.value,replyValue:f.replyValue.value.trim(),status:'UNREAD',createdAt:serverTimestamp()});m.textContent='Enquiry sent.';f.reset();}catch(err){m.textContent='Could not send enquiry.';}finally{b.disabled=false;}});},{loginPath:'login'});
</script></body></html>
