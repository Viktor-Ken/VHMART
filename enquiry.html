<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send an enquiry | VHMART</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preload" href="/fonts/DMSans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/SpaceGrotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/Visuamall/logo.webp" as="image" type="image/webp">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<header class="site-header">
  <nav class="nav" aria-label="Main navigation">
    <a class="brand" href="/">VHMART</a>
    <div class="nav-links">
      <a href="/marketplace">Marketplace</a>
      <a href="/login">Sign in</a>
    </div>
  </nav>
</header>
<main class="page">
  <a id="back" href="/marketplace">Back</a>
  <section class="form-panel">
    <h1>Send an enquiry</h1>
    <p id="intro">Tell the vendor what you need and how to reach you.</p>
    <form id="enquiryForm" novalidate>
      <label for="replyMethod">How should the vendor reach you? *
        <select id="replyMethod" required>
          <option value="">Choose a contact method</option>
          <option value="email">Email</option>
          <option value="phone">Phone</option>
          <option value="whatsapp">WhatsApp</option>
        </select>
      </label>
      <label for="replyValue" id="replyValueLabel">Your contact details *
        <input id="replyValue" type="text" maxlength="120" required autocomplete="off">
      </label>
      <label for="message">Your enquiry *
        <textarea id="message" rows="6" minlength="10" maxlength="2000" required placeholder="What would you like to know?"></textarea>
      </label>
      <button class="button button--primary" type="submit">Send enquiry</button>
      <p id="message-status" role="status"></p>
    </form>
  </section>
</main>
<script type="module">
// Enquiry form.
//
// The enquiry cannot be attributed or answered without a way to reply, so a
// reply method and its value are both required. The account email is offered as
// a default because it is the address the vendor already knows is verified, but
// the customer may supply any method - including a phone number the vendor does
// not have.
//
// This is a different action from "contact vendor": here the vendor is expected
// to reply on their dashboard, so no third-party channel is opened and the terms
// gate does not apply. Contacting a vendor directly does open an external link,
// which is why that path requires the acceptance.

import { auth, database } from '/js/firebase.js';
import { get, ref, push, set, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js';

const SAFE_ID = /^[A-Za-z0-9_-]{1,128}$/;
const params = new URLSearchParams(location.search);
const vendorId = (params.get('vendor') || '').trim();
const productId = (params.get('product') || '').trim();
const status = document.querySelector('#message-status');
const form = document.querySelector('#enquiryForm');
const method = document.querySelector('#replyMethod');
const value = document.querySelector('#replyValue');
const label = document.querySelector('#replyValueLabel');

// Validate the reply value for the chosen method. A malformed phone number or a
// javascript: URL in the email field would otherwise be stored and then shown to
// the vendor.
function validateReply(chosen, raw) {
  const input = String(raw || '').trim();
  if (!input || input.length > 120) return 'Enter your contact details so the vendor can reply.';
  if (chosen === 'email') {
    return /^[^\s@,;:<>()[\]\\"]+@[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+$/.test(input)
      ? null : 'Enter a valid email address.';
  }
  const digits = input.replace(/\D/g, '');
  if (digits.length < 7 || digits.length > 15) return 'Enter a valid phone number, including country code.';
  return null;
}

method.addEventListener('change', () => {
  const chosen = method.value;
  label.firstChild.textContent = chosen === 'email' ? 'Your email address *' : 'Your phone or WhatsApp number *';
  value.setAttribute('type', chosen === 'email' ? 'email' : 'tel');
  status.textContent = '';
});

if (vendorId && !SAFE_ID.test(vendorId)) {
  form.replaceChildren();
  document.querySelector('h1').textContent = 'This enquiry link is not valid.';
} else if (vendorId) {
  await showVendor(vendorId);
}

async function showVendor(id) {
  try {
    const snapshot = await get(ref(database, `vendors/${id}`));
    const vendor = snapshot.val();
    if (vendor && vendor.status === 'ACTIVE') {
      document.querySelector('#intro').textContent =
        `Tell ${vendor.businessName || 'this vendor'} what you need and how to reach you.`;
      document.querySelector('#back').href = `/vendor-profile?id=${encodeURIComponent(id)}`;
    }
  } catch (error) {
    console.error(error);
  }
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  status.textContent = '';

  if (!auth.currentUser) {
    // The rules require customerUid to match the signed-in user, so an anonymous
    // enquiry cannot be stored at all. Send them to sign in rather than failing
    // with a permission error.
    location.href = `/login?next=${encodeURIComponent(location.pathname + location.search)}`;
    return;
  }

  const replyMethod = method.value;
  const problem = validateReply(replyMethod, value.value);
  if (problem) {
    status.textContent = problem;
    return;
  }

  const body = document.querySelector('#message').value.trim();
  if (body.length < 10) {
    status.textContent = 'Please describe what you would like to know.';
    return;
  }

  const button = form.querySelector('button');
  button.disabled = true;
  status.textContent = 'Sending your enquiry...';

  try {
    const enquiry = push(ref(database, 'enquiries'));
    await set(enquiry, {
      vendorId,
      productId: productId || '',
      customerUid: auth.currentUser.uid,
      // Prefilled from the account so the vendor can see it, but the customer
      // supplies their own below and that is what is validated and stored.
      customerEmail: (auth.currentUser.email || '').slice(0, 200),
      replyMethod,
      replyValue: String(value.value).trim().slice(0, 120),
      message: body.slice(0, 2000),
      status: 'NEW',
      createdAt: serverTimestamp()
    });
    status.textContent = 'Your enquiry has been sent. The vendor will reply using the details you gave.';
    form.reset();
  } catch (error) {
    console.error(error);
    status.textContent = 'We could not send your enquiry. Please try again.';
  } finally {
    button.disabled = false;
  }
});

// Offer the verified account email as a starting point rather than making the
// customer retype it.
auth.onAuthStateChanged((user) => {
  if (!user) return;
  if (!method.value && user.email) {
    method.value = 'email';
    method.dispatchEvent(new Event('change'));
    value.value = user.email;
  }
});
</script>
<script src="/js/brand-avatar.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/track.js"></script>
</body>
</html>
